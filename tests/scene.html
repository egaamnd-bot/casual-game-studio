<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse scene tests</title>
  <style>html, body { margin: 0; height: 100%; background: #0B0F19; overflow: hidden; }</style>
</head>
<body>
  <script>
    // Drives the real game with synthetic mouse input: hold/release, focus loss, pause button,
    // retry lock, pickup dimming, campaign save rules and Endless best-score preservation.
    // Results go into the page title. Needs internet for Phaser (CDN).
    try { localStorage.clear(); localStorage.setItem('pulse.best', '77'); } catch (e) {}
    // ?noassets=1 runs the same checks with the code-drawn shapes instead of sprites.
    window.PULSE_ASSET_BASE = '../src/';
    window.PULSE_TEST = {
      autoStart: true, bot: false, mode: 'campaign', stageIndex: 0,
      noAssets: new URLSearchParams(location.search).get('noassets') === '1',
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/rhythm.js"></script>
  <script src="../src/js/storage.js"></script>
  <script src="../src/js/sfx.js"></script>
  <script src="../src/js/melody.js"></script>
  <script src="../src/js/overdrive.js"></script>
  <script src="../src/js/level.js"></script>
  <script src="../src/js/stages.js"></script>
  <script src="../src/js/campaign.js"></script>
  <script src="../src/js/patterns.js"></script>
  <script src="../src/js/skins.js"></script>
  <script src="../src/js/render.js"></script>
  <script src="../src/js/ui.js"></script>
  <script src="../src/js/assets.js"></script>
  <script src="../src/js/sprite-view.js"></script>
  <script src="../src/js/game-scene.js"></script>
  <script src="../src/js/menu-scenes.js"></script>
  <script src="../src/js/main.js"></script>
  <script>
    const C = Pulse.CONFIG;
    const results = [];
    let failures = 0;
    const check = (ok, msg) => { if (!ok) failures++; if (!ok) results.push('FAIL ' + msg); };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const scene = () => window.__pulseScene;

    function at(gx, gy) {
      const rect = document.querySelector('canvas').getBoundingClientRect();
      const k = rect.width / window.__pulseGame.scale.width; // screen game px
      return { clientX: rect.left + gx * k, clientY: rect.top + gy * k };
    }
    function down(gx, gy) {
      const p = at(gx, gy);
      document.querySelector('canvas').dispatchEvent(new MouseEvent('mousedown', Object.assign({ bubbles: true, button: 0, buttons: 1 }, p)));
    }
    function up(gx, gy) {
      const p = at(gx, gy);
      window.dispatchEvent(new MouseEvent('mouseup', Object.assign({ bubbles: true, button: 0, buttons: 0 }, p)));
      document.querySelector('canvas').dispatchEvent(new MouseEvent('mouseup', Object.assign({ bubbles: true, button: 0, buttons: 0 }, p)));
    }
    // Steps the scene by hand (16.7 ms frames) so the checks do not depend on how fast this machine renders.
    const frames = (sc, n, until) => { for (let i = 0; i < n; i++) { sc.update(performance.now(), 16.667); if (until && until()) return true; } return !until; };
    const savedData = () => JSON.parse(localStorage.getItem('pulse.save.v1') || '{"campaign":{"stages":{}}}');

    // Record whether pickups are drawn dimmed.
    const dimLog = [];
    const origPickup = Pulse.Render.pickup;
    Pulse.Render.pickup = function (g, seg, x, dimmed) { dimLog.push(dimmed); return origPickup.apply(this, arguments); };

    async function run() {
      for (let i = 0; i < 150 && !(scene() && scene().state === 'playing'); i++) await wait(100); // slow servers load assets late
      await wait(300);
      const s = scene();
      check(s && s.mode === 'campaign' && s.state === 'playing', 'campaign stage starts');
      const cx = s.SW * 0.75, cy = s.SH / 2; // tap in the open lane ahead of the orb

      // Hold and release.
      down(cx, cy); await wait(50); frames(s, 40);
      check(s.radius === C.orb.minRadius, `hold shrinks orb fully (r=${s.radius})`);
      check(s.canCollect(), 'notes are collected at any size (intentional portrait rule)');
      up(cx, cy); await wait(50); frames(s, 60);
      check(s.radius === C.orb.radius, `release restores orb (r=${s.radius})`);

      // Focus loss while holding: released and paused, orb regrows.
      down(cx, cy); await wait(50); frames(s, 10);
      s.game.events.emit('blur'); await wait(100); frames(s, 10);
      check(s.state === 'paused', 'focus loss pauses');
      check(!s.isHeld(), 'focus loss releases touch');
      up(cx, cy);
      down(cx, cy); up(cx, cy); await wait(100); frames(s, 60);
      check(s.state === 'playing', 'tap resumes');
      check(s.radius === C.orb.radius, 'orb not stuck shrunk after focus loss (regrows once play resumes)');

      // Pause button.
      down(s.pauseBtn.x, s.pauseBtn.y); up(s.pauseBtn.x, s.pauseBtn.y); await wait(100);
      check(s.state === 'paused', 'pause button pauses');
      down(cx, cy); up(cx, cy); await wait(100);
      check(s.state === 'playing', 'tap resumes after pause button');

      // Rhythm clock: runs only while playing, stays in step with the level, restarts on retry.
      check(s.clock.bpm === Pulse.STAGES[0].world.bpm, `stage 1 clock runs at the world's tempo (${s.clock.bpm})`);
      check(Math.abs(s.clock.t - s.level.time) < 1e-6, 'run clock and level clock agree');
      s.pause(); const frozen = s.clock.t; await wait(300); frames(s, 10);
      check(s.clock.t === frozen, 'run clock is frozen while paused');
      down(cx, cy); up(cx, cy); await wait(100); frames(s, 20);
      check(s.state === 'playing' && s.clock.t > frozen && Math.abs(s.clock.t - s.level.time) < 1e-6, 'run clock continues after resume');
      check(s.orbFx && s.orbFx.glow >= 1 && s.orbFx.along >= 1 && s.orbFx.across >= 1 && s.orbFx.radius >= s.radius - 1e-9, 'orb effects never shrink the drawn orb');
      check(s.radius === C.orb.radius, 'orb effects leave the collision radius alone');

      // Input sounds are never delayed to the beat.
      check(C.groove.inputDelay === 0, 'shrink and release sounds play at once');

      // ---- Overdrive in the real scene: pause, retry, rules unchanged ----
      {
        const OD = Pulse.Overdrive;
        s.test.bot = true; // keep alive while stepping by hand
        check(s.od && !s.od.active && s.od.fx === 0, 'a run starts without Overdrive');
        const radiusBefore = s.radius, rBase = C.orb.radius;
        while (!s.od.active) OD.charge(s.od, 'chargedBreak', {});
        s.overdriveStarted();
        frames(s, 30);
        check(s.od.active && s.od.fx > 0 && s.od.fx < 1, `Overdrive eases in (fx ${s.od.fx.toFixed(2)})`);
        frames(s, 60 * 2);
        check(s.od.fx > 0.97, 'and reaches full glow');
        check(s.radius === radiusBefore && s.radius === rBase, 'Overdrive never changes the collision radius');
        check(s.orbFx.radius >= s.radius - 1e-9, 'the drawn orb is still never smaller than the collision circle');
        const left = s.od.remaining;
        frames(s, 60);
        check(Math.abs((left - s.od.remaining) - 1) < 0.03, `it counts down in run time (${(left - s.od.remaining).toFixed(3)} s per 60 frames)`);
        s.pause();
        const frozen = s.od.remaining;
        frames(s, 120);
        check(s.od.active && s.od.remaining === frozen, 'pause freezes Overdrive');
        s.game.events.emit('blur'); frames(s, 10);
        check(s.od.active && s.od.remaining === frozen, 'losing focus does not drain or end it');
        down(cx, cy); up(cx, cy); await wait(100); frames(s, 6);
        check(s.state === 'playing' && s.od.active && s.od.remaining < frozen, 'resume continues Overdrive where it stopped');
        Pulse.Audio.setVolume('sfx', 0);
        const rem = s.od.remaining; frames(s, 60);
        check(s.od.active && s.od.remaining < rem, 'muting sound does not change Overdrive');
        Pulse.Audio.setVolume('sfx', 0.8);
        s.od.remaining = 0.05; frames(s, 5);
        check(!s.od.active && s.od.meter === 0, 'Overdrive ends by itself');
        frames(s, 60 * 3);
        check(s.od.fx === 0, 'and the glow fades out completely');
        // Combo and meter after a retry.
        while (!s.od.active) OD.charge(s.od, 'pass', {});
        s.combo = 7;
        s.startRun();
        check(!s.od.active && s.od.meter === 0 && s.od.fx === 0 && s.od.activations === 0 && s.combo === 0, 'retry (startRun) clears Overdrive, the meter and the combo');
        s.test.bot = false;
      }

      const sprites = !!s.view;
      check(sprites === !window.PULSE_TEST.noAssets, `renderer is ${sprites ? 'sprites' : 'shapes'} as requested`);
      check(C.pickup.dimAlpha === undefined, 'pickups are never dimmed: one note, same look at any size');

      // Crash (no input): no completion recorded, next stage stays locked, retry lock.
      frames(s, 6000, () => s.state === 'over');
      check(s.state === 'over', 'idle play crashes');
      check(!savedData().campaign.stages[Pulse.STAGES[0].id], 'crash records no completion');
      check(!Pulse.Campaign.isUnlocked(Pulse.Save.load(), 1), 'crash does not unlock stage 2');
      down(cx, cy); up(cx, cy); await wait(50);
      check(s.state === 'over', 'tap right after crash is ignored (retry lock)');
      await wait(500);
      down(cx, cy); up(cx, cy); await wait(100); frames(s, 3);
      check(s.state === 'playing' && s.level.travelled < 200, 'tap after lock restarts from the beginning');
      check(s.clock.t < 0.3 && s.level.time < 0.3, `retry restarts the run clock (t=${s.clock.t.toFixed(2)})`);

      // Completion with autopilot: recorded, unlocks next, legacy best untouched.
      s.test.bot = true;
      frames(s, 12000, () => s.state === 'complete');
      check(s.state === 'complete', 'autopilot completes stage 1');
      const rec = savedData().campaign.stages[Pulse.STAGES[0].id];
      check(rec && rec.completed && rec.bestStars === s.result.stars && rec.bestStars >= 1, 'completion saved with stars');
      check(Pulse.Campaign.isUnlocked(Pulse.Save.load(), 1), 'completion unlocks stage 2');
      check(localStorage.getItem('pulse.best') === '77', 'prototype best score preserved');
      check(s.nextBtn.visible && s.retryBtn.visible && s.backBtn.visible, 'completion shows next/retry/stages');

      // Endless regression.
      s.test.bot = false;
      s.scene.start('game', { mode: 'endless' });
      await wait(300);
      const e = scene();
      check(e.mode === 'endless' && e.level instanceof Pulse.EndlessLevel, 'endless uses the pattern generator');
      check(e.best === 77, `endless best migrated (best=${e.best})`);
      e.startRun(); e.test.bot = true; frames(e, 600);
      check(e.state === 'playing' && e.score > 0, `endless plays and scores (score=${e.score})`);

      // ---- Audio lifecycle (state checks; real playback needs a genuine tap on a device) ----
      const A = () => Pulse.Audio.status();
      check(Pulse.Music.wanted === 'WORLD_1_GAMEPLAY', `endless starts on the World 1 track (${Pulse.Music.wanted})`);
      while (!e.od.active) Pulse.Overdrive.charge(e.od, 'chargedBreak', {});
      const odLeft = e.od.remaining;
      e.elapsed = 35; e.step(1 / 60);
      check(Pulse.Music.wanted === 'WORLD_2_GAMEPLAY', `endless moves to the World 2 track after 30 s (${Pulse.Music.wanted})`);
      e.elapsed = 65; e.step(1 / 60);
      check(Pulse.Music.wanted === 'WORLD_3_GAMEPLAY', `endless moves to the World 3 track after 60 s (${Pulse.Music.wanted})`);
      check(e.od.active && e.od.remaining < odLeft && e.od.remaining > odLeft - 0.1, 'a track change leaves Overdrive running and undisturbed');
      check(e.clock.bpm === 140 && Pulse.Rhythm.trackTime(e.clock) < 0.1, `endless clock follows the track change (${e.clock.bpm} BPM)`);
      e.pause();
      check(e.state === 'paused' && Pulse.Music.level < 1, 'pause ducks the music');
      check(Pulse.Music.holding === true, 'pause holds the music where it is, so resuming needs no seek');
      down(cx, cy); up(cx, cy); await wait(100);
      check(e.state === 'playing' && Pulse.Music.level === 1 && Pulse.Music.holding === false, 'resume restores the music level and releases the hold');
      e.game.events.emit('hidden'); await wait(50);
      check(A().hidden && A().musicPaused && !A().holding, 'app in background: music paused, hum stopped');
      e.game.events.emit('visible'); await wait(50);
      check(!A().hidden, 'app back in foreground');
      check(e.state === 'paused', 'going to the background also pauses the run');
      down(cx, cy); up(cx, cy); await wait(100);
      e.test.bot = false;
      frames(e, 9000, () => e.state === 'over');
      check(e.state === 'over' && Pulse.Music.wanted === null, 'crash stops the gameplay music (game-over sting plays instead)');
      check(typeof e.crashReason === 'string' && e.reasonText.visible, `crash shows a reason ("${e.crashReason}")`);
      Pulse.Audio.setVolume('music', 0);
      check(A().musicPaused && Pulse.Audio.volume('music') === 0, 'music volume 0 silences music');
      Pulse.Audio.setVolume('music', 0.8);

      // Campaign: a world's first stage opens with the transition sting; others play the world track.
      window.PULSE_TEST.holdReady = true; // stay on ready screens from here on
      e.scene.start('game', { mode: 'campaign', stageIndex: 4 }); await wait(300);
      check(Pulse.Music.wanted === null, 'stage 5 (World 2 opener): music waits for the run, sting plays');
      scene().startRun(); await wait(100);
      check(Pulse.Music.wanted === 'WORLD_2_GAMEPLAY', 'stage 5 run: World 2 track');
      scene().scene.start('game', { mode: 'campaign', stageIndex: 9 }); await wait(300);
      check(Pulse.Music.wanted === 'WORLD_3_GAMEPLAY', 'stage 10: World 3 track from the ready screen');
      check(scene().od && !scene().od.active && scene().od.meter === 0 && scene().od.fx === 0, 'a new stage starts with a fresh Overdrive state');

      // Menus render, with the menu theme.
      scene().scene.start('menu'); await wait(300);
      check(Pulse.Music.wanted === 'MENU_THEME', 'menu plays the menu theme');
      window.__pulseGame.scene.getScenes(true)[0].scene.start('stages'); await wait(300);
      check(window.__pulseGame.scene.getScenes(true)[0].scene.key === 'stages', 'stage select opens');

      document.title = (failures ? `FAIL ${failures}` : 'PASS scene tests') + (results.length ? ' | ' + results.join(' | ') : '');
    }
    window.addEventListener('error', (ev) => { document.title = 'ERROR ' + ev.message + ' @ ' + String(ev.error && ev.error.stack).split('\n').slice(1, 3).join(' <- '); });
    run().catch((err) => { document.title = 'ERROR ' + err.message + ' @ ' + String(err.stack).split('\n').slice(1, 3).join(' <- '); });
  </script>
</body>
</html>
