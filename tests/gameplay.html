<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse gameplay test</title>
  <style>html, body { margin: 0; height: 100%; background: #0B0F19; overflow: hidden; }</style>
</head>
<body>
  <script>
    // Runs the real game scene. ?bot=1 uses the autopilot; without it nobody touches the screen.
    // ?mode=campaign&stage=N plays campaign stage N (0-based); ?start=0 opens the menu instead;
    // ?fresh=1 clears saved data first. Results go into the page title.
    // Phaser loads from a CDN because there is no local node_modules.
    const params = new URLSearchParams(location.search);
    const seconds = Number(params.get('seconds') || 30);
    if (params.get('fresh') === '1') { try { localStorage.clear(); } catch (e) {} }
    // Assets load from ../src/. In Chrome/Edge a file:// page needs --allow-file-access-from-files
    // for that; ?noassets=1 forces the code-drawn shapes instead.
    window.PULSE_ASSET_BASE = '../src/';
    window.PULSE_TEST = {
      noAssets: params.get('noassets') === '1',
      bot: params.get('bot') === '1',
      autoStart: params.get('start') !== '0',
      mode: params.get('mode') || 'endless',
      stageIndex: Number(params.get('stage') || 0),
      holdReady: params.get('ready') === '1', // open the stage but stay on its ready screen
      onCrash(elapsed, score) {
        document.title = `CRASH at ${elapsed.toFixed(1)}s score ${score}`;
      },
      onComplete(elapsed, energy, bonus, stars) {
        document.title = `COMPLETE in ${elapsed.toFixed(1)}s energy ${energy} bonus ${bonus} stars ${stars}`;
      },
    };
    // ?open=stages (with start=0) jumps to a menu screen, for screenshots.
    if (params.get('open')) {
      const openWhenReady = () => {
        const active = window.__pulseGame && window.__pulseGame.scene.getScenes(true)[0];
        if (active && active.scene.key === 'menu') active.scene.start(params.get('open'));
        else setTimeout(openWhenReady, 100);
      };
      setTimeout(openWhenReady, 100);
    }
    setTimeout(() => {
      if (document.title.startsWith('CRASH') || document.title.startsWith('COMPLETE')) return;
      const s = window.__pulseScene;
      document.title = s
        ? `SURVIVED ${s.elapsed.toFixed(1)}s score ${s.score} x${s.multiplier} state ${s.state}`
        : 'ERROR scene did not start';
    }, seconds * 1000);
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/storage.js"></script>
  <script src="../src/js/sfx.js"></script>
  <script src="../src/js/level.js"></script>
  <script src="../src/js/stages.js"></script>
  <script src="../src/js/campaign.js"></script>
  <script src="../src/js/patterns.js"></script>
  <script src="../src/js/skins.js"></script>
  <script src="../src/js/render.js"></script>
  <script src="../src/js/ui.js"></script>
  <script src="../src/js/assets.js"></script>
  <script src="../src/js/sprite-view.js"></script>
  <script src="../src/js/game-scene.js"></script>
  <script src="../src/js/menu-scenes.js"></script>
  <script src="../src/js/main.js"></script>
</body>
</html>
