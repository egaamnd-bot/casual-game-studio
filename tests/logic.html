<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse logic tests</title>
</head>
<body>
  <pre id="out">running…</pre>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/level.js"></script>
  <script src="../src/js/stages.js"></script>
  <script src="../src/js/campaign.js"></script>
  <script src="../src/js/patterns.js"></script>
  <script>
    // Core rules and Endless pattern generator tests. No Phaser needed.
    // Open in a browser; the page title becomes "PASS ..." or "FAIL ...".
    const C = Pulse.CONFIG;
    const R = C.orb.radius;
    const W = C.width;
    const lines = [];
    let failures = 0;
    function check(ok, message) {
      if (!ok) {
        failures++;
        if (failures <= 25) lines.push('FAIL ' + message);
      }
    }

    function seeded(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // ---- Collision and rules ----
    check(Pulse.circleRect(50, 50, 10, 55, 40, 20, 20), 'circle overlapping rect edge should hit');
    check(!Pulse.circleRect(50, 50, 10, 61, 40, 20, 20), 'circle 11px from rect should miss');
    check(Pulse.circleRect(50, 50, 10, 0, 0, 100, 100), 'circle inside rect should hit');
    check(!Pulse.circleRect(50, 50, 10, 57.1, 57.1, 10, 10), 'circle near rect corner should miss');
    check(Pulse.isCharged(R) && Pulse.isCharged(R - 7) && !Pulse.isCharged(R - 8) && !Pulse.isCharged(C.orb.minRadius), 'charged = within 8 px of full size');

    // Barrier rule, frame by frame: charged smashes, shrunk crashes, untouched does nothing.
    const lv = new Pulse.Level(W, 1100);
    const orbY = 770;
    const bar = () => Object.assign(lv.obtain(), { active: true, kind: 'barrier', y: orbY - R - 10, h: C.barrier.thickness, broken: false, scored: false });
    let b = bar();
    check(lv.resolve(b, orbY, R) === 'break' && b.broken && b.scored, 'full-size orb smashes barrier');
    check(lv.resolve(b, orbY, R) === null, 'smashed barrier is gone');
    b = bar();
    check(lv.resolve(b, orbY, C.orb.minRadius + 20) === null, 'barrier not yet touching a small orb');
    b.y = orbY - 30;
    check(lv.resolve(b, orbY, C.orb.minRadius + 20) === 'crash', 'shrunk orb touching barrier crashes');
    b = bar();
    check(lv.resolve(b, orbY, R - 8) === 'crash', 'orb 8 px under full size is not charged: crash');

    // ---- Endless runs ----
    // Plays with the same rules as GameScene (Level.resolve). policy(level, orbY, speed) → hold?
    function simulate(seed, seconds, policy) {
      const height = 1100;
      const oy = Math.round(height * C.orb.yRatio);
      const level = new Pulse.EndlessLevel(W, height, seeded(seed));
      let radius = R, elapsed = 0;
      const ev = { pass: 0, break: 0, collect: 0, bonus: 0, miss: 0, transitions: 0, holdFrames: 0, frames: 0 };
      const dt = 1 / 60;
      let lastHeld = false;
      const late = [];
      while (elapsed < seconds) {
        const speed = level.speedAt(elapsed);
        const held = policy(level, oy, speed);
        if (held !== lastHeld) ev.transitions++;
        lastHeld = held;
        if (held) ev.holdFrames++;
        ev.frames++;
        const target = held ? C.orb.minRadius : R;
        radius = radius > target ? Math.max(target, radius - C.orb.shrinkRate * dt) : Math.min(target, radius + C.orb.growRate * dt);
        elapsed += dt;
        level.update(dt, level.speedAt(elapsed), elapsed);
        for (const s of level.segments) {
          if (!s.active) continue;
          const e = level.resolve(s, oy, radius);
          if (e === 'crash') return { crashed: true, elapsed, ev, level, late };
          if (e === 'collect' && s.variant === 'bonus') ev.bonus++;
          else if (e) ev[e]++;
        }
        // Spacing used each item's predicted speed; it must never be slower than reality.
        for (const it of level.items) {
          if (!it.checked && level.travelled >= it.at) {
            it.checked = true;
            if (level.speedAt(elapsed) > it.speed + 1e-6) late.push(it);
          }
        }
      }
      return { crashed: false, elapsed, ev, level, late };
    }

    const SEEDS = 60, SECONDS = 150;
    const used = {};
    let items = 0, repeats = 0, transitions = 0, holdShare = 0, smashed = 0, bonusSeen = 0, bonusTaken = 0;
    for (let seed = 1; seed <= SEEDS; seed++) {
      const run = simulate(seed, SECONDS, Pulse.autopilot);
      check(!run.crashed, `seed ${seed}: perfect-timing autopilot crashed at ${run.elapsed.toFixed(1)}s (unfair pattern?)`);
      check(run.late.length === 0, `seed ${seed}: ${run.late.length} items arrived faster than their spacing assumed`);
      const errs = Pulse.Track.validateItems(run.level.items, (it) => it.speed, `seed ${seed}`);
      check(errs.length === 0, errs.slice(0, 2).join('; '));
      const log = run.level.patternLog;
      for (let i = 0; i < log.length; i++) {
        used[log[i]] = (used[log[i]] || 0) + 1;
        if (i && log[i] === log[i - 1]) repeats++;
      }
      items += run.level.items.length;
      transitions += run.ev.transitions;
      holdShare += run.ev.holdFrames / run.ev.frames;
      smashed += run.ev.break;
      bonusSeen += run.level.items.filter((it) => it.type === 'bonus' && it.checked).length;
      bonusTaken += run.ev.bonus;
    }
    check(repeats === 0, `${repeats} back-to-back pattern repeats`);
    check(Object.keys(used).length === Pulse.PATTERNS.length, `all ${Pulse.PATTERNS.length} patterns appear (saw ${Object.keys(used).join(', ')})`);

    // A cautious player who never lets go between close gaps (so skips every dare) must survive too.
    const cautious = (level, oy, speed) => {
      let nearest = null, bottom = -Infinity;
      for (const s of level.segments) {
        if (!s.active || s.kind === 'pickup' || s.broken) continue;
        if (s.kind === 'gate' && (s.need >= R || s.y >= oy + R)) continue;
        const btm = s.y + s.h;
        if (btm < oy - R - speed * 0.75) continue;
        if (btm > bottom) { nearest = s; bottom = btm; }
      }
      return !!nearest && nearest.kind === 'gate';
    };
    let cautiousBonus = 0;
    for (let seed = 1; seed <= 20; seed++) {
      const run = simulate(seed, SECONDS, cautious);
      check(!run.crashed, `seed ${seed}: cautious player (skips dares) crashed at ${run.elapsed.toFixed(1)}s`);
      cautiousBonus += run.ev.bonus;
    }

    // Holding the whole time is no longer a winning strategy; nor is never holding.
    const held = simulate(7, 60, () => true);
    check(held.crashed && held.elapsed < 8, `always holding should crash on the opening barrier, got crashed=${held.crashed} at ${held.elapsed.toFixed(1)}s`);
    const idle = simulate(7, 60, () => false);
    check(idle.crashed && idle.elapsed < 5, `never holding should crash on the first gap, got crashed=${idle.crashed} at ${idle.elapsed.toFixed(1)}s`);

    // Same seed → same pattern stream (Endless is random per run but reproducible in tests).
    const a = simulate(11, 40, Pulse.autopilot), b2 = simulate(11, 40, Pulse.autopilot);
    check(JSON.stringify(a.level.patternLog) === JSON.stringify(b2.level.patternLog), 'pattern stream is reproducible from a seed');

    const mins = SEEDS * SECONDS / 60;
    lines.push(`${SEEDS} seeds × ${SECONDS}s autopilot: ${items} items, ${smashed} barriers smashed`);
    lines.push(`hold/release changes per minute: ${(transitions / mins).toFixed(1)}; time spent holding: ${(100 * holdShare / SEEDS).toFixed(0)}%`);
    lines.push(`mint taken: autopilot ${bonusTaken}/${bonusSeen}; cautious player (holds through dares, 20 seeds) took ${cautiousBonus} and survived`);
    lines.push('patterns: ' + Object.entries(used).map(([k, v]) => `${k} ${v}`).join(', '));
    lines.push(`always-hold crashed at ${held.elapsed.toFixed(2)}s; never-hold crashed at ${idle.elapsed.toFixed(2)}s`);
    lines.unshift(failures === 0 ? 'PASS' : `FAIL (${failures})`);
    document.getElementById('out').textContent = lines.join('\n');
    document.title = lines.join(' | ');
  </script>
</body>
</html>
