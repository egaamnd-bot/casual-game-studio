<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse Shatter Symphony tests</title>
  <style>html, body { margin: 0; height: 100%; background: #0B0F19; overflow: hidden; }</style>
</head>
<body>
  <script>
    // Shatter Symphony (docs/SHATTER_SYMPHONY.md): event ledger, intensity, arpeggio, density restraint, stem fades,
    // mute / pause / retry / scene transitions, latency, and bit-for-bit gameplay equivalence on and off.
    try { localStorage.clear(); } catch (e) {}
    window.PULSE_ASSET_BASE = '../src/';
    window.PULSE_TEST = { autoStart: true, holdReady: true, bot: false, mode: 'campaign', stageIndex: 0 };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/rhythm.js"></script>
  <script src="../src/js/storage.js"></script>
  <script src="../src/js/sfx.js"></script>
  <script src="../src/js/melody.js"></script>
  <script src="../src/js/symphony.js"></script>
  <script src="../src/js/overdrive.js"></script>
  <script src="../src/js/level.js"></script>
  <script src="../src/js/graze.js"></script>
  <script src="../src/js/mirror.js"></script>
  <script src="../src/js/stages.js"></script>
  <script src="../src/js/campaign.js"></script>
  <script src="../src/js/patterns.js"></script>
  <script src="../src/js/skins.js"></script>
  <script src="../src/js/render.js"></script>
  <script src="../src/js/ui.js"></script>
  <script src="../src/js/assets.js"></script>
  <script src="../src/js/trail.js"></script>
  <script src="../src/js/sprite-view.js"></script>
  <script src="../src/js/game-scene.js"></script>
  <script src="../src/js/menu-scenes.js"></script>
  <script src="../src/js/lab.js"></script>
  <script src="../src/js/lab-scene.js"></script>
  <script src="../src/js/main.js"></script>
  <script>
    const C = Pulse.CONFIG;
    const S = Pulse.Symphony;
    const P = S.pure;
    const fails = [];
    const notes = [];
    let checks = 0;
    const check = (ok, msg) => { checks++; if (!ok) fails.push(msg); };
    const near = (a, b, eps) => Math.abs(a - b) <= eps;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const scene = () => window.__pulseScene;
    const errors = [];
    window.addEventListener('error', (e) => errors.push(e.message));

    // Virtual time: performance.now = real + skew, and every stepped frame adds its dt to the skew, so the 35 ms
    // retrigger guard sees game time passing even though the frames run back to back.
    const realPerf = performance.now.bind(performance);
    let skew = 0;
    performance.now = () => realPerf() + skew;
    const fake = new WeakMap();
    const clockOf = (sc) => { let c = fake.get(sc); if (!c) { c = { now: sc.time.now }; fake.set(sc, c); Object.defineProperty(sc.time, 'now', { get: () => c.now, set: () => {}, configurable: true }); } return c; };
    const frames = (sc, n, until, ms) => { const c = clockOf(sc); const dt = ms || 16.667; for (let i = 0; i < n; i++) { c.now += dt; skew += dt; sc.update(c.now, dt); sc.draw && sc.draw(); if (until && until()) return true; } return !until; };
    const advance = (ms) => { skew += ms; };
    // Steps `n` frames but lets real time pass too (40 ms per 6 frames): arpeggio notes are real audio nodes that end in
    // real time, so a burst of simulated seconds in a few real milliseconds would hit the in-flight cap by itself.
    const play = async (sc, n) => { for (let i = 0; i < n; i += 6) { frames(sc, Math.min(6, n - i)); await wait(40); } };

    // ---- Recorders: every Sfx.play / Sfx.notes call (hooked = taken by the director), every buffer / oscillator start, node creation ----
    const rec = [];
    const realPlay = Pulse.Sfx.play.bind(Pulse.Sfx);
    Pulse.Sfx.play = (name, o) => { const hooked = !!Pulse.Sfx.getHook(); const r = realPlay(name, o); rec.push({ k: 'play', name, o: o || {}, hooked, ok: r, at: realPerf() }); return r; };
    const realNotes = Pulse.Sfx.notes.bind(Pulse.Sfx);
    Pulse.Sfx.notes = (specs, ld) => { const hooked = !!Pulse.Sfx.getHook(); const r = realNotes(specs, ld); rec.push({ k: 'notes', specs, ld, hooked, ok: r, at: realPerf() }); return r; };
    const layerLog = [];
    const realLayer = Pulse.Sfx.layerNote.bind(Pulse.Sfx);
    Pulse.Sfx.layerNote = (spec, delay) => { const q = scene(); const r = realLayer(spec, delay); layerLog.push({ spec, delay, ok: r, tt: Pulse.Rhythm.trackTime(q.clock), bpm: q.clock.bpm, dense: !!(q._symphony && q._symphony.dense), od: !!q.od.active, state: q.state }); return r; };
    const created = { gain: 0, osc: 0, src: 0 };
    const proto = AudioContext.prototype;
    for (const [m, key] of [['createGain', 'gain'], ['createOscillator', 'osc'], ['createBufferSource', 'src']]) { const f = proto[m]; proto[m] = function (...a) { created[key]++; return f.apply(this, a); }; }
    const srcStarts = [];
    const realSrcStart = AudioBufferSourceNode.prototype.start;
    AudioBufferSourceNode.prototype.start = function (...a) { srcStarts.push({ loop: this.loop, dur: this.buffer && this.buffer.duration, when: a[0], off: a[1], cur: this.context.currentTime, real: realPerf() }); return realSrcStart.apply(this, a); };
    let ramps = null; // while an array: every setValueAtTime / linearRamp on any AudioParam
    const rLin = AudioParam.prototype.linearRampToValueAtTime, rSet = AudioParam.prototype.setValueAtTime;
    AudioParam.prototype.linearRampToValueAtTime = function (v, t) { if (ramps) ramps.push({ k: 'ramp', v, t }); return rLin.call(this, v, t); };
    AudioParam.prototype.setValueAtTime = function (v, t) { if (ramps) ramps.push({ k: 'set', v, t }); return rSet.call(this, v, t); };
    let intervals = 0;
    const sI = window.setInterval, cI = window.clearInterval;
    window.setInterval = (...a) => { const id = sI(...a); intervals++; ids.add(id); return id; };
    const ids = new Set();
    window.clearInterval = (id) => { if (ids.delete(id)) intervals--; return cI(id); };

    const odOn = (x) => { x.od.active = true; x.od.remaining = C.overdrive.duration; x.od.meter = C.overdrive.threshold; };
    const stubAligned = (x, on) => { x.aligned = () => (on === undefined ? x.state === 'playing' : on); };
    const real = (name) => rec.filter((r) => r.k === 'play' && r.name === name && !r.hooked && r.ok).length;
    const packs = () => rec.filter((r) => r.k === 'play' && /^pack/.test(r.name) && !r.hooked && r.ok);
    const noteCalls = () => rec.filter((r) => r.k === 'notes' && !r.hooked);
    const gainSum = (list) => list.reduce((a, s) => a + (s.gain || 0), 0);
    // Unless a bot plays, the level is frozen (nothing moves, nothing can crash or finish), so the audio rules can be
    // driven for as long as needed; the real Phaser loop keeps ticking during awaits and must not end the run.
    const calm = (q, opts) => { if (!(opts && opts.bot)) q.level.update = function () {}; return q; };
    const startLab = async (opts) => { window.__pulseGame.scene.start('game', { mode: 'campaign', lab: S.LAB_ID }); await wait(400); const q = scene(); q.test = Object.assign({ holdReady: true }, opts || {}); return calm(q, opts); };
    const startStage = async (idx, opts) => { window.__pulseGame.scene.start('game', { mode: 'campaign', stageIndex: idx }); await wait(400); const q = scene(); q.test = Object.assign({ holdReady: true }, opts || {}); return calm(q, opts); };
    // Fires cues from inside the scene's own step (as the game does): the director's frame batch is in effect.
    const inStep = (q, fn) => { const old = Object.prototype.hasOwnProperty.call(q, 'updateStem'); const prev = q.updateStem; let done = false; q.updateStem = function () { if (!done) { done = true; fn(); } return prev.apply(this, arguments); }; frames(q, 1); if (old) q.updateStem = prev; else delete q.updateStem; };
    const reset = () => { rec.length = 0; layerLog.length = 0; };

    async function run() {
      for (let i = 0; i < 200 && !(scene() && scene().state); i++) await wait(100);
      await Pulse.Audio.loading; await wait(300); Pulse.Audio.unlock(); await wait(100);
      const baseIntervals = intervals;

      // ================= Pure rules =================
      const K = C.combo;
      check(P.targetLevel(0, false, false) === 0 && P.targetLevel(3, false, false) === 0 && P.targetLevel(K.layerA, false, false) === 1 && P.targetLevel(K.layerB, false, false) === 2 && P.targetLevel(K.flourish, false, false) === 3, 'intensity target: combo 0-3 -> 0, 4 -> 1, 8 -> 2, 16 -> 3');
      check(P.targetLevel(0, false, true) === 2 && P.targetLevel(5, false, true) === 2 && P.targetLevel(20, false, true) === 3 && P.targetLevel(0, true, false) === 3, 'a fresh route clear holds level 2; Overdrive is 3');
      // Easing: up slower than down, never overshoots, the same at 30 / 60 / 144 fps.
      const sim = (from, to, fps, secs) => { let v = from; for (let i = 0; i < fps * secs; i++) v = P.ease(v, to, 1 / fps); return v; };
      const up = [30, 60, 144, 250].map((f) => sim(0, 3, f, 1.5)), dn = [30, 60, 144, 250].map((f) => sim(3, 0, f, 1.5));
      check(Math.max(...up) - Math.min(...up) < 1e-9 && Math.max(...dn) - Math.min(...dn) < 1e-9, `easing is frame-rate independent (${up.map((v) => v.toFixed(4)).join('/')})`);
      check(up[0] < 3 && dn[0] > 0 && sim(3, 0, 60, 1) < 3 - (sim(0, 3, 60, 1)) + 3 - 0.001 && (3 - sim(0, 3, 60, 1)) > sim(3, 0, 60, 1), 'it rises more slowly than it falls and never overshoots');
      check(P.arpMode(0) === 0 && P.arpMode(1.74) === 0 && P.arpMode(1.75) === 1 && P.arpMode(2.54) === 1 && P.arpMode(2.55) === 2 && P.arpMode(3) === 2, 'arpeggio modes: off below 1.75, eighths to 2.55, sixteenths above');
      // Arpeggio degrees: integers, inside the world's pentatonic scale octave range, rests where expected.
      let allDeg = true, rests = 0, notesLow = 0, notesHigh = 0;
      for (let k = 0; k < 64; k++) { const a = P.arpDegree(1, k), b = P.arpDegree(2, k); if (a === null) rests++; else { notesLow++; if (!Number.isInteger(a) || a < 0 || a > 7) allDeg = false; } if (b !== null) notesHigh++; if (b === null || !Number.isInteger(b) || b < 0 || b > 7) allDeg = false; }
      check(allDeg && notesLow === 32 && rests === 32 && notesHigh === 64 && P.arpDegree(0, 5) === null, `arpeggio degrees are integers 0-7; eighths play half the sixteenths (${notesLow}/${rests}), sixteenths all 64`);
      // Every arpeggio pitch is a note of the world's scale (it is built from Melody.hz of a degree).
      for (const w of [1, 2, 3]) { const sc = Pulse.Melody.WORLDS[w]; let ok = true; for (let d = 0; d <= 7; d++) { const semi = Pulse.Melody.semitone(w, d) % 12; if (!sc.scale.includes(semi)) ok = false; } check(ok, `world ${w}: arpeggio degrees 0-7 are all in ${sc.name}`); }
      // Scheduling: each sixteenth is queued exactly once, on the grid, at 30 / 60 / 144 fps and with hitches.
      for (const [fps, bpm] of [[30, 125], [60, 133], [144, 140], [60, 125]]) {
        const stepS = 60 / bpm / 4; let t = 0.013, last = -1, got = [];
        const dt = 1 / fps;
        for (let i = 0; i < fps * 8; i++) { t += dt; const n = P.nextStep(t, stepS, last, C.symphony.lookahead); if (n) { got.push(n); last = n.at; } }
        const gridOk = got.every((n) => near(n.at / stepS, Math.round(n.at / stepS), 1e-9) && n.delay >= 0 && n.delay <= C.symphony.lookahead + 1e-9);
        const uniq = new Set(got.map((n) => Math.round(n.at / stepS))).size === got.length;
        const expected = Math.floor((fps * 8 * dt + 0.013) / stepS);
        check(gridOk && uniq && Math.abs(got.length - expected) <= 1, `${fps} fps @ ${bpm} bpm: every 16th queued once, on the grid, within the ${C.symphony.lookahead * 1000} ms lookahead (${got.length} of ${expected})`);
      }
      { // a 200 ms hitch skips the missed steps rather than burst-playing them
        const stepS = 60 / 125 / 4; let last = -1, t = 1.0; const a = P.nextStep(t, stepS, last, 0.09); last = a ? a.at : last; t += 0.2; const b = P.nextStep(t, stepS, last, 0.09);
        check((!b || b.at > t - 1e-9) && !P.nextStep(t, stepS, b ? b.at : last, 0.09), 'after a hitch only the next step is queued (no burst of the missed ones)');
      }
      // Density.
      const mk = (kind, y, h = 30) => ({ kind, y, h, active: true });
      const OY = 700, SPD = 400;
      check(P.hazardCount([mk('gate', 400), mk('gate', 200), mk('barrier', 100), mk('energy', 300)], OY, SPD, 1.5) === 3, 'density counts walls and barriers inside 1.5 s (gold does not count)');
      check(P.hazardCount([mk('gate', 0)], OY, SPD, 1.5) === 0 && P.hazardCount([Object.assign(mk('gate', 690), { scored: true })], OY, SPD, 1.5) === 0 && P.hazardCount([mk('gate', 690)], OY, SPD, 1.5) === 1, 'beyond reach and already-cleared walls do not count; one on the orb does');
      check(!P.isDense(2, false) && P.isDense(3, false) && P.isDense(2, true) && !P.isDense(1, true), 'dense turns on at 3 and off at 1 (no flutter)');
      // Ledger.
      const cue = (type) => ({ type, prio: S.PRIORITY[type] });
      let r = P.resolve([cue('combo16'), cue('route'), cue('odStart')], null, 10, false);
      check(r.play.type === 'odStart' && r.dropped.length === 2, 'combo 16 + route + Overdrive start in one frame -> only Overdrive start plays');
      r = P.resolve([cue('combo8'), cue('route')], null, 10, false); check(r.play.type === 'route', 'route clear outranks combo 8');
      r = P.resolve([cue('combo8'), cue('odEnd')], null, 10, false); check(r.play.type === 'combo8', 'a tie keeps the earlier arrival');
      r = P.resolve([cue('combo4')], { prio: 2, at: 9.8 }, 10, false); check(!r.play && r.dropped[0].reason === 'window', 'a lower cue inside the window is dropped');
      r = P.resolve([cue('combo8')], { prio: 2, at: 9.8 }, 10, false); check(!r.play, 'an equal cue inside the window is dropped (repeat)');
      r = P.resolve([cue('route')], { prio: 2, at: 9.8 }, 10, false); check(r.play && r.play.type === 'route', 'a higher cue inside the window still plays (escalation)');
      r = P.resolve([cue('combo4')], { prio: 2, at: 9.5 }, 10, false); check(r.play && r.play.type === 'combo4', 'after the window anything plays');
      r = P.resolve([cue('combo4')], null, 10, true); check(!r.play && r.dropped[0].reason === 'dense', 'dense: the quietest cue (combo 4) is skipped');
      r = P.resolve([cue('combo8')], null, 10, true); check(r.play && r.play.type === 'combo8', 'dense: combo 8 still plays');

      // ================= Lab entry, attach rules =================
      S.register();
      const entry = Pulse.Lab.find(S.LAB_ID);
      check(!!entry && entry.flags.symphony === true && entry.base === 's14-safe-or-sorry' && entry.stage.id === 'lab-shatter-symphony', 'the Lab entry exists: stage 14 as a new stage id, flags.symphony');
      check(!Pulse.STAGES.some((s) => s.id === entry.stage.id) && Pulse.STAGES.length === 24 && Pulse.STAGES.findIndex((s) => s.id === 's14-safe-or-sorry') === 13, 'it is not a campaign stage: 24 stages, stage 14 where it was');
      check(entry.stage.items === Pulse.STAGES[13].items && entry.stage.speed.start === Pulse.STAGES[13].speed.start, 'it plays stage 14\'s own layout and speed (same items array)');
      check(typeof C.symphony === 'object' && C.symphony.enabled === true, 'CONFIG.symphony.enabled is on by default (the Lab flag is what scopes it)');
      check(!!Pulse.Lab.list().find((e) => e.id === S.LAB_ID) && Pulse.Lab.list().filter((e) => e.id === S.LAB_ID).length === 1, 'registering twice does not duplicate the entry');

      let q = await startStage(13); // campaign stage 14: no director
      check(!q._symphony && !Object.prototype.hasOwnProperty.call(q, 'step') && !Object.prototype.hasOwnProperty.call(q, 'comboMilestone'), 'campaign stage 14: no director, no wrapped methods');
      q = await startLab();
      check(!!q._symphony && q.lab && q.lab.id === S.LAB_ID && S.current() === q._symphony, 'the Lab run attaches the director');
      const wrappedNames = ['step', 'setState', 'startRun', 'comboMilestone', 'routeClear', 'overdriveStarted', 'overdriveEnded'];
      check(wrappedNames.every((n) => Object.prototype.hasOwnProperty.call(q, n)), 'it wraps exactly the scene\'s own cue / step / state methods on the instance');
      check(S.attach(q) === q._symphony, 'attaching again returns the same director (no double wrapping)');
      const oldScene = q;
      C.symphony.enabled = false; q = await startLab(); check(!q._symphony, 'CONFIG.symphony.enabled = false: no director in the Lab run'); C.symphony.enabled = true;
      check(!Object.prototype.hasOwnProperty.call(oldScene, 'step') && !oldScene._symphony && Pulse.Sfx.getHook() === null, 'shutting a scene down detaches: its methods are its own again, no hook left');
      q = await startLab(); stubAligned(q);

      // ================= Event ledger in the game =================
      q.startRun(); frames(q, 30);
      const visuals = []; const realQuality = q.quality.bind(q); q.quality = (t, c) => { visuals.push(t); return realQuality(t, c); };
      // Baseline: the same three cues with the director removed (the old behaviour: three stacked cues).
      reset(); const dir = q._symphony; dir.detach();
      q.comboMilestone(16); q.routeClear({}); q.overdriveStarted();
      const basePacks = packs().map((p) => p.name).sort().join(), baseNotes = noteCalls().length, baseSum = noteCalls().reduce((a, c) => a + gainSum(c.specs), 0);
      check(basePacks === 'packCombo16,packOdOn,packRouteClear' && baseNotes === 3, `baseline (no director): three stacked cues (${basePacks}; ${baseNotes} phrases)`);
      q.od.active = false; q.od.remaining = 0; q.od.meter = 0; q.startRun(); frames(q, 30); advance(100);
      S.attach(q, { force: true }); stubAligned(q); const d2 = q._symphony; check(!!d2 && d2 !== dir, 're-attached for the comparison');
      visuals.length = 0; q.quality = (t, c) => { visuals.push(t); return realQuality(t, c); };
      reset(); advance(100);
      inStep(q, () => { q.comboMilestone(16); q.routeClear({}); q.overdriveStarted(); });
      const wp = packs().map((p) => p.name).join(), wn = noteCalls().length, wSum = noteCalls().reduce((a, c) => a + gainSum(c.specs), 0);
      check(wp === 'packOdOn' && wn === 1, `with the director: combo 16 + route + Overdrive in one frame -> one cue (${wp}; ${wn} phrase)`);
      check(visuals.includes('FLOURISH!') && visuals.includes('ROUTE CLEAR!'), `their visuals (labels) still show (${visuals.join(',')})`);
      check(wSum < baseSum * 0.5, `summed phrase gain ${wSum.toFixed(3)} vs ${baseSum.toFixed(3)} stacked`);
      check(d2.stats.played === 1 && d2.stats.dropped === 2 && d2.log.filter((l) => !l.played).every((l) => l.reason === 'same-moment'), `ledger: 1 played, 2 dropped as same-moment (${JSON.stringify(d2.stats)})`);
      check(d2.log.filter((l) => l.played)[0].type === 'odStart', 'and the winner is Overdrive start');
      // Repeats of the same cue in one frame, and in following frames.
      const fresh = async () => { q.od.active = false; q.od.remaining = 0; q.startRun(); stubAligned(q); frames(q, 20); await wait(500); advance(200); reset(); return q._symphony; }; // real wait: effect voices end in real time
      let d = await fresh();
      inStep(q, () => { for (let i = 0; i < 5; i++) q.comboMilestone(8); });
      check(real('packCombo8') === 1 && noteCalls().length === 1, 'five identical combo-8 triggers in one frame -> one sample, one phrase');
      frames(q, 6); advance(60); q.comboMilestone(8); check(real('packCombo8') === 1, 'and again 0.1 s later (inside the window): still one');
      frames(q, 30); advance(500); q.comboMilestone(8); check(real('packCombo8') === 2, 'after the window it plays again');
      d = await fresh(); q.comboMilestone(4); frames(q, 6); advance(100); q.routeClear({});
      check(real('packCombo4') === 1 && real('packRouteClear') === 1, 'an escalation inside the window (combo 4, then a route clear) plays both: the higher one is a new, bigger moment');
      d = await fresh(); q.routeClear({}); frames(q, 6); advance(100); q.comboMilestone(8); q.comboMilestone(4);
      check(real('packRouteClear') === 1 && real('packCombo8') === 0 && real('packCombo4') === 0, 'a lower cue right after a route clear is swallowed');
      // Voice cap and retrigger guard still hold with the director in front.
      d = await fresh(); const v0 = Pulse.Audio.status().voices;
      for (let i = 0; i < 40; i++) { inStep(q, () => { q.comboMilestone(16); q.routeClear({}); q.overdriveStarted(); }); }
      check(Pulse.Audio.status().voices - v0 <= 6 && Pulse.Audio.status().voices <= 6, `never more than 6 effect voices after 120 cue triggers (${Pulse.Audio.status().voices})`);
      check(Pulse.Sfx.stats().active <= 14, `and at most 14 synthesized notes (${Pulse.Sfx.stats().active})`);
      // The lead note of a hit is never captured or delayed: it plays through the normal path even inside a cue frame.
      d = await fresh(); reset(); inStep(q, () => { q.hitFeedback('pickup', { quality: 'good' }); q.comboMilestone(8); });
      const leads = rec.filter((x) => x.k === 'notes' && !x.hooked && x.specs.some((s) => !s.layer));
      check(leads.length === 1 && rec.findIndex((x) => x === leads[0]) < rec.findIndex((x) => x.k === 'play' && x.name === 'packCombo8' && !x.hooked), 'the lead note of a hit plays at once, before the cue is resolved');

      // ================= Latency: same audio time as the baseline, same frame =================
      const probe = async (withDir) => {
        const x = scene(); if (withDir) { if (!x._symphony) S.attach(x, { force: true }); } else if (x._symphony) x._symphony.detach();
        stubAligned(x); x.od.active = false; x.startRun(); frames(x, 40); await wait(500); advance(500); srcStarts.length = 0; reset();
        const t0 = realPerf(); let phase = Pulse.Rhythm.Groove.delay(x.clock, true, 0.08);
        if (withDir) inStep(x, () => x.comboMilestone(16)); else { x.comboMilestone(16); }
        const s = srcStarts.filter((a) => a.dur < 1).pop();
        return s ? { rel: (s.when || s.cur) - s.cur, wall: s.real - t0, phase } : null;
      };
      const pb = await probe(false), pd = await probe(true);
      check(!!pb && !!pd, 'both runs started the combo-16 sample');
      check(pb && pd && near(pb.phase, pd.phase, 0.02) && Math.abs(pb.rel - pd.rel) <= 0.0167 + Math.abs(pb.phase - pd.phase), `the cue is scheduled at the same audio time (baseline +${pb && (pb.rel * 1000).toFixed(1)} ms, director +${pd && (pd.rel * 1000).toFixed(1)} ms; both within one 60 fps frame of each other)`);
      check(pd && pd.wall < 16.7, `and within one frame of the event on the wall clock (${pd && pd.wall.toFixed(2)} ms, includes one full scene step)`);
      check(pd && pd.rel <= 0.08 + 0.0167, `the quantising wait never exceeded the existing 80 ms bound (${pd && (pd.rel * 1000).toFixed(1)} ms)`);
      q = scene(); if (!q._symphony) S.attach(q, { force: true }); stubAligned(q);

      // ================= Intensity and the arpeggio =================
      q.od.active = false; q.startRun(); stubAligned(q); d = q._symphony; reset();
      const setCombo = (n) => { q.scoring.combo = n; };
      await play(q, 90); check(layerLog.length === 0 && d.v < 0.01, 'combo 0: level 0, no arpeggio');

        const x = await startLab({ bot: true, route: 'safe' }); stubAligned(x); x.startRun(); let dn = 0, tot = 0, arpWhileDense = 0;
        frames(x, 90000, () => { tot++; if (x._symphony.dense) dn++; return x.state !== 'playing'; });
        arpWhileDense = layerLog.filter((l) => l.ok && l.dense).length;
        notes.push(`stage 14 dense ${(100 * dn / tot).toFixed(0)}% of frames`);
        check(arpWhileDense === 0 && dn > 0 && dn < tot, `in the real stage the layer sees both dense (${(100 * dn / tot).toFixed(0)}% of frames) and sparse stretches, and never plays while dense`);
        // Ledger discipline over a whole real run: consecutive played cues are either a window apart or an escalation.
        const pl = x._symphony.log.filter((l) => l.played); let bad = 0; for (let i = 1; i < pl.length; i++) if (pl[i].at - pl[i - 1].at < C.symphony.window && S.PRIORITY[pl[i].type] <= S.PRIORITY[pl[i - 1].type]) bad++;
        check(bad === 0, `a whole real run: no two played cues inside ${C.symphony.window} s unless the second outranks the first (${pl.length} cues in the log)`);
      }
      // Back to the original: leave the Lab, the director is gone and nothing is left behind.
      scene().scene.start('menu'); await wait(500);
      check(S.current() === null && Pulse.Sfx.getHook() === null && Pulse.Sfx.layerCount() === 0, 'at the end: no director, no hook, no layer notes');
      check(intervals <= baseIntervals + 3, `timers back to baseline (${intervals} vs ${baseIntervals})`);
      check(errors.length === 0, `page errors: ${errors.join(' | ')}`);
    }
    run().then(() => { document.title = fails.length ? `FAIL ${fails.length}: ${fails.join(' | ')}` : `PASS symphony tests ${checks} checks | ${notes.join(' | ')}`; })
      .catch((e) => { document.title = 'FAIL error ' + e.message + ' ' + (e.stack || '').split('\n')[1]; });
  </script>
</body>
</html>
