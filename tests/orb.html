<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse symmetric orb</title>
  <style>html, body { margin: 0; height: 100%; background: #0B0F19; overflow: hidden; }</style>
</head>
<body>
  <script>
    // Developer Campaign / QA Gauntlet (docs/DEV_GAUNTLET.md): every section through the real game systems, retry, chaining, exit,
    // save isolation, flag cleanup and the production guard. The per-feature tests stay; this supplements them.
    try { localStorage.clear(); } catch (e) {}
    window.PULSE_ASSET_BASE = '../src/';
    window.PULSE_TEST = { autoStart: true, holdReady: true, bot: false, mode: 'campaign', stageIndex: 0 };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/rhythm.js"></script>
  <script src="../src/js/storage.js"></script>
  <script src="../src/js/sfx.js"></script>
  <script src="../src/js/melody.js"></script>
  <script src="../src/js/symphony.js"></script>
  <script src="../src/js/overdrive.js"></script>
  <script src="../src/js/level.js"></script>
  <script src="../src/js/graze.js"></script>
  <script src="../src/js/mirror.js"></script>
  <script src="../src/js/stages.js"></script>
  <script src="../src/js/campaign.js"></script>
  <script src="../src/js/resonance.js"></script>
  <script src="../src/js/patterns.js"></script>
  <script src="../src/js/skins.js"></script>
  <script src="../src/js/render.js"></script>
  <script src="../src/js/ui.js"></script>
  <script src="../src/js/assets.js"></script>
  <script src="../src/js/trail.js"></script>
  <script src="../src/js/worldshift.js"></script>
  <script src="../src/js/sprite-view.js"></script>
  <script src="../src/js/game-scene.js"></script>
  <script src="../src/js/menu-scenes.js"></script>
  <script src="../src/js/lab.js"></script>
  <script src="../src/js/lab-scene.js"></script>
  <script src="../src/js/gauntlet.js"></script>
  <script src="../src/js/gauntlet-scene.js"></script>
  <script src="../src/js/main.js"></script>
  <script>
    // Issue #42: compact symmetric energy orb. Visual only: no taper/streak attached, rim + halo drawn, wake detached, collision/save untouched.
    const C = Pulse.CONFIG;
    const fails = []; let checks = 0;
    const check = (ok, msg) => { checks++; if (!ok) fails.push(msg); };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const errors = []; window.addEventListener('error', (e) => errors.push(e.message));
    const scene = () => window.__pulseScene;
    const fake = new WeakMap();
    const clockOf = (sc) => { let c = fake.get(sc); if (!c) { c = { now: sc.time.now }; fake.set(sc, c); Object.defineProperty(sc.time, 'now', { get: () => c.now, set: () => {}, configurable: true }); } return c; };
    const frames = (sc, n) => { const c = clockOf(sc); for (let i = 0; i < n; i++) { c.now += 16.667; sc.update(c.now, 16.667); sc.draw && sc.draw(); } };
    const run = async () => {
      for (let i = 0; i < 100 && !(scene() && scene().view); i++) await wait(100);
      const q = scene(), V = q.view;
      const save0 = localStorage.getItem(Pulse.Save.KEY);
      check(!!V && V.comet && V.vfx, 'comet look with the atlas is the running visual path');
      check(C.comet.symmetricOrb === true, 'symmetric orb is on by default');
      const hud0 = JSON.stringify(C.orb);
      q.test = { holdReady: true, bot: true, route: 'safe' };
      q.startRun(); frames(q, 90);
      check(q.state === 'playing', 'run is playing');
      check(!V.cometTail.visible && !V.cometStreak.visible, 'no tapered head or fine streak is attached to the orb');
      const w = V.cometBody.displayWidth, hgt = V.cometBody.displayHeight;
      check(Math.abs(w - hgt) / w < 0.08, `the disc is round (${w.toFixed(1)} x ${hgt.toFixed(1)})`);
      check(w / 2 >= q.radius - 0.01, 'the disc still covers the collision circle');
      check(V.orbRim.commandBuffer.length > 0, 'rim and halo are drawn');
      const a = V.ribbon.map((r) => r.alpha);
      check(a[0] < 0.02 && Math.max(...a) > 0.1, `the wake fades in from the orb edge (first stamp alpha ${a[0].toFixed(3)}, max ${Math.max(...a).toFixed(2)})`);
      check(V.ribbon.some((r) => r.visible) && V.readyRing !== undefined, 'the wake is still shown and the charge-ready ring still exists');
      // shrink and grow keep a round body and the exact collision radius
      for (const hold of [true, false]) {
        q.inputHeld = hold; if (q.input) q.input.held = hold;
        frames(q, 40);
        const d = V.cometBody;
        check(Math.abs(d.displayWidth - d.displayHeight) / d.displayWidth < 0.08, `round while ${hold ? 'shrinking' : 'growing'}`);
        check(d.displayWidth / 2 >= q.radius - 0.01, `covers the collision circle while ${hold ? 'shrinking' : 'growing'}`);
      }
      // flag off restores the previous look (tail and streak back, rim cleared)
      C.comet.symmetricOrb = false; frames(q, 3);
      check(V.cometTail.visible && V.cometStreak.visible && V.orbRim.commandBuffer.length === 0, 'flag off: previous look returns');
      C.comet.symmetricOrb = true; frames(q, 3);
      check(!V.cometTail.visible && V.orbRim.commandBuffer.length > 0, 'flag on again: symmetric look');
      // death: the same renderer call the game makes for a dead orb clears the rim and halo
      V.renderComet(q.radius, true, q.orbFx);
      check(V.orbRim.commandBuffer.length === 0 && !V.cometTail.visible, 'rim and halo are cleared when the orb is dead');
      check(JSON.stringify(C.orb) === hud0, 'orb collision config unchanged');
      check(localStorage.getItem(Pulse.Save.KEY) === save0, 'save untouched');
      check(errors.length === 0, 'no script errors: ' + errors.join('; '));
    };
    run().then(() => { document.title = fails.length ? `FAIL ${fails.length}: ${fails.join(' | ')}` : `PASS orb tests ${checks} checks`; })
      .catch((e) => { document.title = 'FAIL error ' + e.message + ' ' + (e.stack || '').split('\n')[1]; });
  </script>
</body>
</html>
