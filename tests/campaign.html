<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse campaign tests</title>
</head>
<body>
  <pre id="out">running…</pre>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/rhythm.js"></script>
  <script src="../src/js/storage.js"></script>
  <script src="../src/js/level.js"></script>
  <script src="../src/js/stages.js"></script>
  <script src="../src/js/campaign.js"></script>
  <script src="../src/js/skins.js"></script>
  <script>
    // Campaign (portrait, steering), stars, skins and save-data tests. No Phaser needed.
    // Open in a browser; the page title becomes "PASS ..." or "FAIL ...".
    const C = Pulse.CONFIG;
    const R = C.orb.radius;
    const W = C.width;
    const lines = [];
    let failures = 0, checks = 0;
    function check(ok, message) {
      checks++;
      if (!ok) { failures++; if (failures <= 40) lines.push('FAIL ' + message); }
    }
    const fresh = () => Pulse.Save.defaults();

    // In-memory stand-in for localStorage.
    function memoryStorage(initial) {
      const data = Object.assign({}, initial);
      return {
        data,
        getItem: (k) => (k in data ? data[k] : null),
        setItem: (k, v) => { data[k] = String(v); },
      };
    }

    // Plays a stage with the game's own rules (Level.resolve), steering and holding like a player.
    // opts: { hold(level, orbY, speed) → bool, steer(level, orb, orbY, speed) → target x, dt }.
    // Returns the run, including when each contact happened relative to the beat grid.
    const BOT = {
      hold: (lv, oy, sp) => Pulse.autopilot(lv, oy, sp),
      steer: (lv, orb, oy, sp) => Pulse.autosteer(lv, orb.x, oy, sp),
    };
    function play(stage, opts, height) {
      opts = Object.assign({}, BOT, opts);
      height = height || 960;
      const orbY = Math.round(height * C.orb.yRatio);
      const level = new Pulse.Campaign.CampaignLevel(W, height, stage);
      const orb = Pulse.Orb.create();
      const dt = opts.dt || 1 / 60;
      let frames = 0, energy = 0, bonus = 0, smashed = 0, crashedOn = null, perfect = 0, good = 0;
      const hits = []; // { type, err } contact time minus the item's planned beat moment (s)
      const done = (crashed, completed) => ({ crashed, crashedOn, completed, frames, energy, bonus, smashed, perfect, good, hits, travelled: level.travelled, x: orb.x });
      while (frames * dt < 300) {
        const speed = level.speedAt();
        const held = opts.hold(level, orbY, speed);
        Pulse.Orb.setTarget(orb, opts.steer(level, orb, orbY, speed), W);
        Pulse.Orb.step(orb, held, dt, W);
        frames++;
        level.update(dt, level.speedAt());
        for (const s of level.segments) {
          if (!s.active) continue;
          const e = level.resolve(s, orbY, orb.radius, orb.charge, orb.x);
          if (e === 'crash') {
            crashedOn = s.kind === 'barrier' ? (s.charged ? 'charged barrier' : 'barrier') : 'gap';
            return done(true, false);
          }
          if (e === 'collect') { if (s.variant === 'bonus') bonus++; else energy++; }
          if (e === 'break') smashed++;
          if (e === 'collect' || e === 'break') {
            const it = level.items.find((q) => q.arriveBeat === s.arriveBeat);
            if (it && it.hit !== undefined) hits.push({ type: e, err: level.time - it.hit });
          }
          if (s.quality === 'perfect' && (e === 'pass' || e === 'collect')) perfect++;
          else if (s.quality === 'good' && (e === 'pass' || e === 'collect')) good++;
        }
        if (level.finishY() >= orbY) return done(false, true);
      }
      return done(false, false);
    }
    const cautious = { hold: (lv, oy, sp) => Pulse.autopilot(lv, oy, sp, 0.75) };
    const noSteer = { steer: () => C.orb.x };
    const sloppy = { steer: (lv, orb, oy, sp) => Pulse.autosteer(lv, orb.x, oy, sp, 1.2, 0.2) };
    // A habit holder: stays shrunk and only lets go when a barrier is 0.3 s away. That's enough
    // to regrow for a plain barrier but not to fill the charge ring for a charged one.
    const habitHolder = { hold: (level, orbY, speed) => !level.segments.some((s) =>
      s.active && s.kind === 'barrier' && !s.broken && s.y + s.h > orbY - R - speed * 0.3) };

    const median = (a) => { const b = a.slice().sort((x, y) => x - y); return b[b.length >> 1]; };
    const pct = (a, q) => { const b = a.slice().sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.floor(q * b.length))]; };

    // Per-stage numbers: clear time between neighbouring obstacles (seconds at the speed there),
    // obstacles per second, lateral zig-zag, and the share of each kind of item.
    function stats(stage) {
      const track = Pulse.Campaign.compile(stage, W, 960);
      const prof = Pulse.Rhythm.profile(stage.speed.start, stage.speed.end, track.speedLength);
      const clears = [];
      for (let i = 1; i < track.items.length; i++) {
        const a = track.items[i - 1], b = track.items[i];
        clears.push((b.at - (a.at + a.h)) / prof.speed(b.at));
      }
      const gates = track.items.filter((it) => it.type === 'gate');
      let jump = 0;
      for (let i = 1; i < gates.length; i++) jump += Math.abs(gates[i].cx0 - gates[i - 1].cx0);
      const seconds = prof.time(track.finishAt);
      const walls = track.items.filter((it) => it.type === 'gate' || it.type === 'barrier').length;
      const n = track.items.length;
      return {
        median: median(clears), max: Math.max(...clears), items: n, seconds, wallsPerSec: walls / seconds, itemsPerSec: n / seconds,
        jump: gates.length > 1 ? jump / (gates.length - 1) : 0,
        barriers: track.items.filter((it) => it.type === 'barrier').length / n,
        notes: track.items.filter((it) => it.type === 'energy' || it.type === 'bonus').length / n,
        tight: gates.filter((g) => g.need < 40).length / Math.max(1, gates.length),
        speed: stage.speed.end,
      };
    }

    // ---- Stage definitions ----
    const ids = new Set();
    const STAGES = Pulse.STAGES;
    check(STAGES.length === 12, `expected 12 stages, found ${STAGES.length}`);
    check(['s1-first-pulse', 's2-find-the-rhythm', 's3-controlled-overload', 's4-split-decision', 's5-charged-energy', 's6-the-long-hold',
      's7-double-trouble', 's8-greed-is-optional', 's9-overload', 's10-precision', 's11-final-circuit', 's12-the-final-pulse'].every((id, i) => STAGES[i].id === id),
      'all 12 stage ids keep their places (save compatibility)');
    STAGES.forEach((stage, i) => {
      const errors = Pulse.Campaign.validate(stage, W);
      check(errors.length === 0, `stage ${i + 1} invalid: ${errors.join('; ')}`);
      check(!ids.has(stage.id), `duplicate stage id ${stage.id}`);
      ids.add(stage.id);
      check(stage.world.index === Math.floor(i / 4) + 1, `stage ${i + 1} is in world ${Math.floor(i / 4) + 1}`);
      check(typeof stage.teaches === 'string' && stage.teaches.length > 10, `stage ${i + 1} documents what it teaches`);
      check(typeof stage.profile === 'string' && stage.profile.length > 20, `stage ${i + 1} documents its difficulty profile`);
      const track = Pulse.Campaign.compile(stage, W);
      check(track.finishAt > 0 && Number.isFinite(track.finishAt), `stage ${stage.id}: finite finish`);
      check(track.energyTotal >= 5, `stage ${stage.id}: at least 5 gold for meaningful stars (${track.energyTotal})`);
      for (let k = 1; k < track.items.length; k++) check(track.items[k].at > track.items[k - 1].at, `stage ${stage.id}: items ordered`);
      for (const it of track.items) {
        if (it.type === 'gate') check(it.gapL >= C.wallMinWidth - 1e-6 && it.gapR <= W - C.wallMinWidth + 1e-6, `stage ${stage.id}: gap keeps wall at the lane edge`);
        if (it.type === 'energy' || it.type === 'bonus') check(it.x >= C.steer.margin && it.x <= W - C.steer.margin, `stage ${stage.id}: note inside the steerable lane`);
      }
    });

    // Which mechanics each stage uses (from its source data).
    function mechanics(stage) {
      const m = new Set();
      const off = (it) => Math.abs(it.x || 0);
      stage.items.forEach((it) => {
        if (it.type === 'barrier') m.add(it.charged ? 'charged' : 'barrier');
        if (it.type === 'gate' && it.length) m.add('tunnel');
        // A mint inside a route fork is a lane reward (taught as part of the route choice), not the
        // stage-8 "greed is optional" mint.
        if (it.type === 'bonus' && !it.route) m.add('mint');
        if (it.fork) m.add('route');
        if (it.slide && it.slide.kind !== 'breathe') m.add('slide');
        if (it.slide && it.slide.kind === 'breathe') m.add('breathe');
        if (it.type === 'gate' && it.need < R && !it.length && !it.slide) m.add('narrow');
        if (it.type === 'gate' && off(it) >= 100) m.add('wide-steer');
      });
      return m;
    }
    const INTRO = { narrow: 1, 'wide-steer': 1, barrier: 2, slide: 3, breathe: 4, charged: 5, tunnel: 6, mint: 8, route: 4 };
    for (const [mech, stageNo] of Object.entries(INTRO)) {
      const first = STAGES.findIndex((s) => mechanics(s).has(mech)) + 1;
      check(first === stageNo, `${mech} is introduced in stage ${stageNo} (first used in stage ${first})`);
    }
    check(STAGES[0].items.every((it) => it.type !== 'barrier' && !it.slide && !it.length && it.type !== 'bonus'), 'stage 1 teaches steering, shrinking and notes only');
    // Teaching stages don't also raise the speed much.
    for (const [mech, stageNo] of Object.entries(INTRO)) {
      if (stageNo < 2) continue;
      const s = STAGES[stageNo - 1], prev = STAGES[stageNo - 2];
      check(s.speed.start - prev.speed.end <= 30, `stage ${stageNo} (introduces ${mech}) starts at most 30 px/s faster than stage ${stageNo - 1} ended`);
    }
    // First encounters are gentle (read straight from the authored data, whatever the pace multiplier).
    const firstItem = (stage, pred) => {
      const i = stage.items.findIndex(pred);
      return { it: stage.items[i], prev: stage.items[i - 1], next: stage.items[i + 1], i };
    };
    let f = firstItem(STAGES[0], (it) => it.type === 'gate' && it.x && Math.abs(it.x) >= 100);
    check(f.it.need >= 76, 'first big sideways move is through a wide gap');
    f = firstItem(STAGES[0], (it) => it.type === 'gate' && it.need < R);
    check(f.it.need >= 50 && f.it.t >= 0.6, 'first narrow gap: roomy and announced');
    f = firstItem(STAGES[1], (it) => it.type === 'barrier');
    check(f.prev.type !== 'gate' && f.it.t >= 0.7, 'first barrier: not right after a gap, long lead');
    f = firstItem(STAGES[4], (it) => it.charged);
    check(f.prev.type !== 'gate' && f.it.t >= 0.9, 'first charged barrier: not right after a gap (ring already full), long lead');
    f = firstItem(STAGES[5], (it) => it.length);
    check(f.it.need >= 46 && f.it.t >= 0.7, 'first tunnel: roomy and well announced');
    f = firstItem(STAGES[2], (it) => it.slide);
    check(f.it.slide.amp <= 40, 'first moving gap: a gentle swing');
    f = firstItem(STAGES[7], (it) => it.type === 'bonus' && !it.route);
    check(f.it.t >= 0.3, 'first mint: a roomy dare');
    f = firstItem(STAGES[3], (it) => !!it.fork);
    check(f.it.t >= 0.9 && f.prev.type === 'gate' && f.prev.need >= 80 && f.it.need >= 70 && f.it.fork.need >= 44, 'first route fork: a wide decision point before it, a long lead, a roomy safe route and a roomy risk route');

    // ---- Density: closer together than the landscape stages (measured on the same speeds) ----
    // Median clear time (s) between neighbouring items in the 12 landscape stages this replaces.
    const OLD_MEDIAN = [1.14, 1.14, 1.04, 0.90, 0.97, 0.79, 0.74, 0.74, 0.69, 0.69, 0.67, 0.66];
    const OLD_WALLS = [0.32, 0.39, 0.54, 0.53, 0.48, 0.48, 0.67, 0.54, 0.69, 0.80, 0.70, 0.78];
    const stat = STAGES.map(stats);
    const cut = stat.map((s, i) => 1 - s.median / OLD_MEDIAN[i]);
    stat.forEach((s, i) => {
      check(cut[i] >= 0.05, `${STAGES[i].id}: clear time is shorter than before (${(100 * cut[i]).toFixed(0)}% shorter)`);
      check(s.max <= 1.35, `${STAGES[i].id}: no long empty stretch (longest clear ${s.max.toFixed(2)}s)`);
      check(s.items >= 30, `${STAGES[i].id}: at least 30 items (${s.items})`);
      check(s.wallsPerSec >= OLD_WALLS[i] * 0.9, `${STAGES[i].id}: obstacle rate ${s.wallsPerSec.toFixed(2)}/s is not below before (${OLD_WALLS[i]})`);
    });
    const meanCut = cut.reduce((a, b) => a + b, 0) / cut.length;
    check(meanCut >= 0.15, `clear time is ${(100 * meanCut).toFixed(0)}% shorter on average (target ≥ 15%; the brief asked for 20–30%)`);
    // Difficulty curve: top speed rises every stage and clear time falls world by world.
    for (let i = 1; i < 12; i++) check(stat[i].speed > stat[i - 1].speed, `top speed rises every stage (${i}→${i + 1})`);
    const avgW = (a, b, k) => stat.slice(a, b).reduce((s, c) => s + c[k], 0) / (b - a);
    check(avgW(0, 4, 'median') > avgW(4, 8, 'median') && avgW(4, 8, 'median') > avgW(8, 12, 'median'), `clear time falls world by world (${avgW(0, 4, 'median').toFixed(2)} > ${avgW(4, 8, 'median').toFixed(2)} > ${avgW(8, 12, 'median').toFixed(2)} s)`);
    check(avgW(0, 4, 'wallsPerSec') < avgW(8, 12, 'wallsPerSec'), 'obstacles per second rise from world 1 to world 3');
    check(avgW(0, 4, 'tight') < avgW(8, 12, 'tight'), 'narrow gaps become more common from world 1 to world 3');
    // Every stage has its own profile: no two stages share a feature vector.
    const FEATURES = ['median', 'wallsPerSec', 'jump', 'barriers', 'notes', 'tight'];
    const scale = FEATURES.map((k) => Math.max(...stat.map((s) => s[k])) || 1);
    let closest = Infinity, closestPair = '';
    for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
      const d = Math.sqrt(FEATURES.reduce((acc, k, n) => acc + Math.pow((stat[i][k] - stat[j][k]) / scale[n], 2), 0));
      if (d < closest) { closest = d; closestPair = `${i + 1}/${j + 1}`; }
    }
    check(closest > 0.08, `every stage has a distinct difficulty profile (closest pair ${closestPair}: ${closest.toFixed(2)})`);
    check(new Set(STAGES.map((s) => s.profile)).size === 12, 'every stage describes its own profile');
    lines.push('density: ' + stat.map((s, i) => `${i + 1}:med${s.median.toFixed(2)}(-${(100 * cut[i]).toFixed(0)}%) max${s.max.toFixed(2)} ${s.items}it ${s.wallsPerSec.toFixed(2)}w/s jump${s.jump.toFixed(0)}`).join(' | '));

    const [s1, s2, s3] = STAGES;
    const s5 = STAGES[4], s7 = STAGES[6], s8 = STAGES[7];

    // validate() rejects bad data.
    const bad = (base, mutate) => { const s = JSON.parse(JSON.stringify(base)); s.world = base.world; s.sector = base.sector; mutate(s); return Pulse.Campaign.validate(s, W); };
    check(bad(s1, (s) => delete s.id).length > 0, 'missing id is rejected');
    check(bad(s1, (s) => { s.exit = null; }).length > 0, 'missing exit is rejected');
    check(bad(s1, (s) => { s.world = null; }).length > 0, 'missing world is rejected');
    check(bad(s1, (s) => { s.items = []; }).length > 0, 'empty items are rejected');
    check(bad(s1, (s) => { s.items.find((it) => it.type === 'gate').need = 20; }).length > 0, 'unfair narrow gap is rejected');
    check(bad(s1, (s) => { s.items[2].x = 400; }).length > 0, 'a gap outside the lane is rejected');
    check(bad(s7, (s) => { s.items.forEach((it) => { if (it.type === 'gate') it.need = 30; }); }).length > 0, 'a stage of too-narrow gaps is rejected');
    check(bad(s1, (s) => { s.items[0].type = 'laser'; }).length > 0, 'unknown item type is rejected');
    check(bad(s1, (s) => { s.stars = { two: 0.9, three: 0.6 }; }).length > 0, 'inverted star thresholds are rejected');
    check(bad(s3, (s) => { const m = s.items.find((it) => it.slide); m.slide.amp = 200; }).length > 0, 'a swing that leaves the lane is rejected');
    check(bad(s3, (s) => { const m = s.items.find((it) => it.slide); m.slide.beats = 1; }).length > 0, 'a moving gap faster than allowed is rejected');
    check(Pulse.Campaign.validate(null, W).length > 0, 'null stage is rejected');

    // The fairness checker itself, on hand-built tracks (stages never get here: the compiler pushes
    // items to the fairness floor, so these must be built by hand with explicit spacing).
    const place = (list, speed) => { const out = []; let top = 0; for (const src of list) { const it = Pulse.Track.placeItem(Object.assign({}, src, { space: src.space }), top, W); out.push(it); top = it.at + it.h; } return Pulse.Track.validateItems(out, () => speed, 'hand', { width: W }); };
    const ok0 = place([{ type: 'gate', need: 60, x: 0, space: 400 }, { type: 'gate', need: 60, x: 40, space: 400 }], 300);
    check(ok0.length === 0, 'a roomy centred pair is fair: ' + ok0.join('; '));
    const jump = place([{ type: 'gate', need: 40, x: -150, space: 400 }, { type: 'gate', need: 40, x: 150, space: 260 }], 300);
    check(jump.some((e) => /unreachable/.test(e)), 'a 300 px sideways jump in a short clear time is unreachable');
    const jumpOk = place([{ type: 'gate', need: 40, x: -150, space: 400 }, { type: 'gate', need: 40, x: 150, space: 800 }], 300);
    check(jumpOk.length === 0, 'the same jump with a long clear time is fair: ' + jumpOk.join('; '));
    const first = place([{ type: 'gate', need: 40, x: 200, space: 150 }], 300);
    check(first.some((e) => /unreachable/.test(e)), 'the first gap cannot be far off-centre with no lead-in');
    const tight = place([{ type: 'gate', need: 33, x: 0, space: 500 }], 300);
    check(tight.some((e) => /fair minimum|aiming room/.test(e)), 'a gap with less than the minimum aiming room is rejected');
    const note = place([{ type: 'gate', need: 40, x: -150, space: 400 }, { type: 'energy', x: 150, space: 150 }], 300);
    check(note.some((e) => /unreachable/.test(e)), 'a gold note too far sideways to collect is unreachable');
    const noteOk = place([{ type: 'gate', need: 40, x: -150, space: 400 }, { type: 'bonus', x: 200, space: 80 }], 300);
    check(noteOk.length === 0, 'a mint bonus is optional and never constrains the path: ' + noteOk.join('; '));
    const size = place([{ type: 'barrier', space: 500 }, { type: 'gate', need: 40, x: 0, space: 120 }], 300);
    check(size.some((e) => /to become small/.test(e)), 'shrinking too soon after a barrier is still rejected');

    // ---- Playback: completable, reachable, deterministic ----
    STAGES.forEach((stage) => {
      const track = Pulse.Campaign.compile(stage, W);
      // Narrow and tall phones differ only in track length: from 860 (shorter) to 1240 (tallest).
      for (const h of [860, 960, 1200, 1240]) {
        const run = play(stage, {}, h);
        check(run.completed, `${stage.id} @${h}px: autopilot should finish (crashed=${run.crashed})`);
        check(run.energy === track.energyTotal, `${stage.id} @${h}px: all gold reachable (${run.energy}/${track.energyTotal})`);
      }
      for (const dt of [1 / 30, 1 / 144]) {
        const run = play(stage, { dt });
        check(run.completed && run.energy === track.energyTotal, `${stage.id} @${Math.round(1 / dt)} fps: finishes with all gold`);
      }
      const a = play(stage, {}), b = play(stage, {});
      check(JSON.stringify(a) === JSON.stringify(b), `${stage.id}: playback is deterministic`);
      check(JSON.stringify(Pulse.Campaign.compile(stage, W).items) === JSON.stringify(track.items), `${stage.id}: compile is deterministic`);
      const idle = play(stage, { hold: () => false, steer: () => C.orb.x });
      check(idle.crashed && !idle.completed, `${stage.id}: no input must crash`);
      const still = play(stage, noSteer);
      check(still.crashed && !still.completed, `${stage.id}: holding and releasing without ever steering must crash (steering matters)`);
      const hold = play(stage, { hold: () => true });
      if (track.items.some((it) => it.type === 'barrier')) check(hold.crashed, `${stage.id}: holding the whole time must crash on a barrier`);
      const safe = play(stage, cautious);
      check(safe.completed, `${stage.id}: a cautious player who skips every dare can finish`);
      const habit = play(stage, habitHolder);
      const hasCharged = track.items.some((it) => it.charged);
      check(hasCharged ? (habit.crashed && habit.crashedOn === 'charged barrier') || habit.crashed : true,
        `${stage.id}: releasing only 0.3 s before barriers ${hasCharged ? 'fails' : 'is allowed to finish'} (got ${habit.completed ? 'finished' : habit.crashedOn})`);
      const sl = play(stage, sloppy);
      const rate = a.perfect + a.good ? a.perfect / (a.perfect + a.good) : 0;
      lines.push(`${stage.id}: ${(a.frames / 60).toFixed(1)}s, gold ${a.energy}/${track.energyTotal}, mint ${a.bonus}/${track.bonusTotal}, barriers ${a.smashed}, perfect ${(100 * rate).toFixed(0)}%, cautious ${safe.completed ? 'ok' : 'FAIL'}, sloppy-steer ${sl.completed ? 'finishes' : 'crashes at ' + (100 * sl.travelled / track.finishAt).toFixed(0) + '%'}, no-steer crashes at ${(100 * still.travelled / track.finishAt).toFixed(0)}%`);
      // Contacts land on the beat: the moment each barrier is smashed / note collected is within a
      // few tens of milliseconds of the beat grid the stage was built on (grid 0.5 beat = 8th note).
      const bpm = track.bpm, beat = 60 / bpm;
      const sub = stage.grid === undefined ? C.rhythm.grid : stage.grid;
      const errs = a.hits.map((h) => Math.abs(h.err));
      check(errs.length > 10 && pct(errs, 0.9) < 0.07, `${stage.id}: 90% of contacts within 70 ms of the planned beat moment (p90 ${(1000 * pct(errs, 0.9)).toFixed(0)} ms, n=${errs.length})`);
      for (const it of track.items) {
        const g = it.hitBeat / sub;
        check(Math.abs(g - Math.round(g)) < 0.003, `${stage.id}: item ${it.index} lands on the ${sub}-beat grid`);
      }
    });

    // ---- Stars ----
    const cs = Pulse.Campaign.computeStars;
    const st = { stars: { two: 0.6, three: 0.9 } };
    check(cs(st, false, 10, 10) === 0, 'crash awards 0 stars');
    check(cs(st, true, 0, 10) === 1, 'completion alone = 1 star');
    check(cs(st, true, 5, 10) === 1, '50% = 1 star');
    check(cs(st, true, 6, 10) === 2, 'exactly 60% = 2 stars');
    check(cs(st, true, 8, 10) === 2, '80% = 2 stars');
    check(cs(st, true, 9, 10) === 3, 'exactly 90% = 3 stars');
    check(cs(st, true, 10, 10) === 3, '100% = 3 stars');
    check(cs(st, true, 0, 0) === 3, 'no energy in stage: completion = 3 stars');
    check(cs(st, true, 1, 1) === 3 && cs(st, true, 0, 1) === 1, 'single energy: all or nothing');
    // 7 energy: 60% → ceil(4.2) = 5 needed, 90% → ceil(6.3) = 7 needed.
    check(cs(st, true, 4, 7) === 1 && cs(st, true, 5, 7) === 2, '7 energy: 2 stars needs 5');
    check(cs(st, true, 6, 7) === 2 && cs(st, true, 7, 7) === 3, '7 energy: 3 stars needs 7');
    check(cs({}, true, 6, 10) === 2, 'defaults apply when stage has no stars field');
    check(cs({ stars: { three: 1 } }, true, 9, 10) === 2, 'per-stage threshold overrides default');

    // ---- Progress, unlocks, replay ----
    let save = fresh();
    check(Pulse.Campaign.isUnlocked(save, 0) && !Pulse.Campaign.isUnlocked(save, 1), 'only stage 1 unlocked at start');
    let r = Pulse.Campaign.recordCompletion(save, s1.id, 2);
    check(r.unlockedNext === s2, 'first completion unlocks stage 2');
    check(Pulse.Campaign.isUnlocked(save, 1) && !Pulse.Campaign.isUnlocked(save, 2), 'stage 3 still locked');
    r = Pulse.Campaign.recordCompletion(save, s1.id, 1);
    check(save.campaign.stages[s1.id].bestStars === 2 && r.bestStars === 2, 'replay with fewer stars keeps best');
    check(r.unlockedNext === null, 'replay does not re-announce unlock');
    r = Pulse.Campaign.recordCompletion(save, s1.id, 3);
    check(save.campaign.stages[s1.id].bestStars === 3, 'replay with more stars raises best');
    check(Pulse.Campaign.totalStars(save) === 3, 'total stars derived from records');
    save.campaign.stages['unknown-stage'] = { completed: true, bestStars: 3 };
    check(Pulse.Campaign.totalStars(save) === 3, 'records for unknown stages do not count');

    // ---- Skins ----
    save = fresh();
    const solar = Pulse.Skins.byId('solar-flare'), prism = Pulse.Skins.byId('void-prism'), retro = Pulse.Skins.byId('retro-green');
    check(solar.unlockStars === 3 && prism.unlockStars === 6 && retro.unlockStars === 9, 'skin thresholds 3/6/9');
    check(!Pulse.Skins.select(save, 'solar-flare'), 'locked skin cannot be selected');
    r = Pulse.Campaign.recordCompletion(save, s1.id, 2);
    check(r.newSkins.length === 0 && !Pulse.Skins.isUnlocked(save, solar), '2 stars: Solar Flare still locked');
    r = Pulse.Campaign.recordCompletion(save, s2.id, 1);
    check(r.newSkins.length === 1 && r.newSkins[0] === solar, '3 stars unlocks Solar Flare exactly once');
    r = Pulse.Campaign.recordCompletion(save, s2.id, 1);
    check(r.newSkins.length === 0, 'unlock is not repeated');
    check(Pulse.Skins.select(save, 'solar-flare') && Pulse.Skins.selected(save) === solar, 'unlocked skin can be selected');
    Pulse.Campaign.recordCompletion(save, s1.id, 3);
    Pulse.Campaign.recordCompletion(save, s2.id, 3);
    check(Pulse.Skins.isUnlocked(save, prism) && !Pulse.Skins.isUnlocked(save, retro), '6 stars unlocks Void Prism only');
    r = Pulse.Campaign.recordCompletion(save, s3.id, 3);
    check(r.newSkins[0] === retro, '9 stars unlocks Retro Green');
    for (const skin of Pulse.SKINS) {
      check(Object.keys(skin).sort().join() === 'colors,id,name,sprite,unlockStars', `${skin.id}: skin has looks only (no gameplay fields)`);
      check(Object.keys(skin.sprite).sort().join() === 'arcPrefix,atlas,prefix', `${skin.id}: sprite entry names frames only`);
    }

    // ---- Save data ----
    const S = Pulse.Save;
    let mem = memoryStorage();
    check(JSON.stringify(S.load(mem)) === JSON.stringify(fresh()), 'empty storage loads defaults');
    mem = memoryStorage({ 'pulse.best': '42' });
    let loaded = S.load(mem);
    check(loaded.endless.best === 42, 'prototype best score (pulse.best) is migrated');
    S.write(loaded, mem);
    check(JSON.parse(mem.data['pulse.save.v1']).endless.best === 42 && mem.data['pulse.best'] === '42', 'write keeps both keys');
    mem = memoryStorage({ 'pulse.save.v1': '{not json', 'pulse.best': '17' });
    loaded = S.load(mem);
    check(loaded.endless.best === 17, 'malformed save falls back without losing legacy best');
    check(mem.data['pulse.save.corrupt'] === '{not json', 'malformed save is kept as a backup');
    mem = memoryStorage({ 'pulse.save.v1': JSON.stringify({ endless: { best: 5 } }), 'pulse.best': '30' });
    check(S.load(mem).endless.best === 30, 'higher legacy best wins');
    mem = memoryStorage({ 'pulse.save.v1': JSON.stringify({ endless: { best: 50 } }), 'pulse.best': '30' });
    check(S.load(mem).endless.best === 50, 'higher saved best wins');
    loaded = S.sanitize({ endless: { best: 'x' }, campaign: { stages: { a: { bestStars: 7 }, b: null, c: { bestStars: -2 } } }, skins: { selected: 5, unlocked: ['void-prism', 3] } });
    check(loaded.endless.best === 0, 'non-numeric best becomes 0');
    check(loaded.campaign.stages.a.bestStars === 3 && loaded.campaign.stages.a.completed, 'stars clamped to 3 and imply completion');
    check(!('b' in loaded.campaign.stages) && loaded.campaign.stages.c.bestStars === 0, 'bad stage records dropped or clamped');
    check(loaded.skins.selected === 'classic' && loaded.skins.unlocked.join() === 'classic,void-prism', 'bad skin fields cleaned');
    check(S.sanitize('garbage').version === 1 && S.sanitize(null).endless.best === 0, 'non-object saves become defaults');
    check(Pulse.Skins.selected(S.sanitize({ skins: { selected: 'retro-green' } })).id === 'classic', 'selected locked skin falls back to Classic');
    check(Pulse.Skins.selected(S.sanitize({ skins: { selected: 'nope' } })).id === 'classic', 'unknown skin falls back to Classic');
    const throwing = { getItem() { throw new Error('blocked'); }, setItem() { throw new Error('blocked'); } };
    check(S.load(throwing).version === 1, 'blocked storage loads defaults');
    S.write(fresh(), throwing);
    check(true, 'blocked storage write does not throw');
    mem = memoryStorage();
    save = S.load(mem);
    Pulse.Campaign.recordCompletion(save, s1.id, 3);
    Pulse.Skins.select(save, 'solar-flare');
    S.write(save, mem);
    loaded = S.load(mem);
    check(loaded.campaign.stages[s1.id].bestStars === 3 && Pulse.Skins.selected(loaded).id === 'solar-flare', 'progress and skin survive a save/load round trip');

    // ---- 12-stage progression ----
    save = fresh();
    for (let i = 0; i < STAGES.length; i++) {
      check(Pulse.Campaign.isUnlocked(save, i), `stage ${i + 1} unlocked after clearing the stages before it`);
      if (i + 1 < STAGES.length) check(!Pulse.Campaign.isUnlocked(save, i + 1), `stage ${i + 2} locked until stage ${i + 1} is cleared`);
      check(Pulse.Campaign.nextStageIndex(save) === i, `next stage to play is ${i + 1}`);
      r = Pulse.Campaign.recordCompletion(save, STAGES[i].id, 3);
      if (i + 1 < STAGES.length) check(r.unlockedNext === STAGES[i + 1], `clearing stage ${i + 1} announces stage ${i + 2}`);
    }
    check(Pulse.Campaign.totalStars(save) === 36, 'all 12 stages × 3 stars = 36');
    const violet = Pulse.Skins.byId('violet-nova'), whiteout = Pulse.Skins.byId('whiteout');
    check(violet.unlockStars === 12 && whiteout.unlockStars === 15, 'new skins unlock at 12 and 15 stars');
    check(Pulse.Skins.isUnlocked(save, violet) && Pulse.Skins.isUnlocked(save, whiteout), 'all six skins unlocked with 36 stars');
    save = fresh();
    for (let i = 0; i < 4; i++) Pulse.Campaign.recordCompletion(save, STAGES[i].id, 3);
    check(Pulse.Skins.isUnlocked(save, violet) && !Pulse.Skins.isUnlocked(save, whiteout), '12 stars: Violet Nova yes, Whiteout not yet');

    // ---- Migration from the 3-stage campaign (same save key, same ids) ----
    mem = memoryStorage({
      'pulse.save.v1': JSON.stringify({
        version: 1, endless: { best: 88 },
        campaign: { stages: { 's1-first-pulse': { completed: true, bestStars: 3 }, 's2-find-the-rhythm': { completed: true, bestStars: 2 }, 's3-controlled-overload': { completed: true, bestStars: 1 } } },
        skins: { selected: 'solar-flare', unlocked: ['classic', 'solar-flare', 'void-prism'] },
      }),
      'pulse.best': '88',
    });
    loaded = S.load(mem);
    check(loaded.endless.best === 88, 'old save: Endless best kept');
    check(Pulse.Campaign.totalStars(loaded) === 6, 'old save: stars from stages 1–3 kept (6)');
    check(Pulse.Campaign.isUnlocked(loaded, 3) && !Pulse.Campaign.isUnlocked(loaded, 4), 'old save: stage 4 unlocked, stage 5 still locked');
    check(Pulse.Campaign.nextStageIndex(loaded) === 3, 'old save: continues at stage 4');
    check(Pulse.Skins.selected(loaded).id === 'solar-flare', 'old save: selected skin kept');
    check(loaded.settings.music === 0.8 && loaded.settings.sfx === 1, 'old save: audio settings get defaults');
    // A stage already beaten stays open even if an earlier one isn't (stages inserted later).
    loaded.campaign.stages['s2-find-the-rhythm'] = { completed: false, bestStars: 0 };
    check(Pulse.Campaign.isUnlocked(loaded, 2), 'a completed stage never re-locks');

    // ---- Audio settings in the save ----
    loaded = S.sanitize({ settings: { music: 3, sfx: -1 } });
    check(loaded.settings.music === 1 && loaded.settings.sfx === 0, 'settings clamped to 0–1');
    loaded = S.sanitize({ settings: { music: 'loud' } });
    check(loaded.settings.music === 0.8, 'bad setting falls back to default');
    mem = memoryStorage();
    save = S.load(mem);
    save.settings.music = 0.4;
    save.settings.sfx = 0;
    S.write(save, mem);
    loaded = S.load(mem);
    check(loaded.settings.music === 0.4 && loaded.settings.sfx === 0, 'audio settings survive a save/load round trip');

    lines.unshift(`${failures === 0 ? 'PASS' : 'FAIL'} ${checks - failures}/${checks} checks`);
    document.getElementById('out').textContent = lines.join('\n');
    document.title = lines.join(' | ');
  </script>
</body>
</html>
