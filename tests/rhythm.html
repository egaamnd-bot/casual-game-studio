<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pulse rhythm tests</title>
</head>
<body>
  <pre id="out">running…</pre>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/rhythm.js"></script>
  <script src="../src/js/storage.js"></script>
  <script src="../src/js/level.js"></script>
  <script src="../src/js/graze.js"></script>
  <script src="../src/js/mirror.js"></script>
  <script src="../src/js/stages.js"></script>
  <script src="../src/js/campaign.js"></script>
  <script src="../src/js/skins.js"></script>
  <script src="../src/js/render.js"></script>
  <script>
    // Rhythm clock, beat-aligned stages, moving gaps and orb effects. No Phaser needed.
    // Open in a browser; the page title becomes "PASS ..." or "FAIL ...".
    const C = Pulse.CONFIG;
    const R = C.orb.radius;
    const W = C.width;
    const Rh = Pulse.Rhythm;
    const lines = [];
    let failures = 0, checks = 0;
    function check(ok, message) {
      checks++;
      if (!ok) { failures++; if (failures <= 40) lines.push('FAIL ' + message); }
    }
    const near = (a, b, eps) => Math.abs(a - b) <= eps;

    // ---- Clock: beat and bar maths ----
    {
      const c = Rh.createClock({ bpm: 125 }); // beat = 0.48 s, bar = 1.92 s
      check(near(Rh.beatSeconds(125), 0.48, 1e-12), 'beat length at 125 BPM is 0.48 s');
      let p = Rh.position(c);
      check(p.beat === 0 && p.index === 0 && p.phase === 0 && p.bar === 0 && p.beatInBar === 0, 'starts on beat 0 of bar 0');
      Rh.step(c, 0.72);
      p = Rh.position(c);
      check(p.index === 1 && near(p.phase, 0.5, 1e-9) && p.beatInBar === 1, 'at 0.72 s: halfway through beat 1');
      Rh.step(c, 1.2); // t = 1.92
      p = Rh.position(c);
      check(p.bar === 1 && p.beatInBar === 0 && p.index === 4, 'at 1.92 s: first beat of bar 1');
      check(near(Rh.pulse(0), 1, 1e-12) && Rh.pulse(1) === 0 && Rh.pulse(0.5) < Rh.pulse(0.1), 'beat pulse peaks on the beat and eases out');
    }

    // ---- Clock: no drift, whatever the frame rate ----
    {
      for (const bpm of [112, 125, 133, 140]) {
        for (const fps of [20, 30, 59.94, 60, 90, 144]) {
          const c = Rh.createClock({ bpm });
          const dt = 1 / fps;
          const seconds = 600;
          let counted = 0, bars = 0;
          const frames = Math.round(seconds * fps);
          for (let i = 0; i < frames; i++) { const e = Rh.step(c, dt); counted += e.beats; bars += e.bars; }
          const exactBeat = Math.floor(c.t * bpm / 60);
          check(counted === exactBeat, `${bpm} BPM @ ${fps} fps: ${counted} beat events vs ${exactBeat} expected after 10 min`);
          check(bars === Math.floor(exactBeat / 4), `${bpm} BPM @ ${fps} fps: bar events match`);
          check(near(c.t, frames * dt, 1e-6), `${bpm} BPM @ ${fps} fps: clock time matches the frames stepped`);
        }
      }
      // A long hitch (the game clamps frame time to 0.05 s) crosses at most a beat or two.
      const c = Rh.createClock({ bpm: 140 });
      check(Rh.step(c, C.maxFrameSeconds).beats <= 1, 'a clamped frame crosses at most one beat');
    }

    // ---- Pause, resume, retry, track change ----
    {
      const c = Rh.createClock({ bpm: 125 });
      for (let i = 0; i < 100; i++) Rh.step(c, 1 / 60);
      const before = Rh.position(c);
      // Paused: the game doesn't step the clock, so nothing moves however long the pause.
      const after = Rh.position(c);
      check(before.beat === after.beat, 'a paused clock does not move');
      for (let i = 0; i < 20; i++) Rh.step(c, 1 / 60);
      check(near(c.t, 120 / 60, 1e-9), 'resuming continues from the same moment');
      Rh.reset(c);
      check(c.t === 0 && Rh.position(c).beat === 0 && Rh.step(c, 0.01).beats === 0, 'retry restarts at beat 0 with no stray beat event');
      // Endless: the next world's track starts here, at its own tempo.
      Rh.reset(c, 125);
      for (let i = 0; i < 30 * 60; i++) Rh.step(c, 1 / 60);
      Rh.retune(c, 133);
      check(c.bpm === 133 && Rh.position(c).beat === 0 && Rh.trackTime(c) === 0, 'a new track restarts the beat count');
      for (let i = 0; i < 60; i++) Rh.step(c, 1 / 60);
      check(near(Rh.position(c).beat, 133 / 60, 1e-6), 'new tempo applies from the switch');
    }

    // ---- Audio sync ----
    {
      const loop = 76.8;
      check(Rh.seekTarget(10, 10.05, loop) === null, 'music within tolerance is left alone');
      check(near(Rh.seekTarget(10, 10.3, loop), 10, 1e-9), 'music 0.3 s ahead is pulled back to the clock');
      check(near(Rh.seekTarget(10, 9.6, loop), 10, 1e-9), 'music behind the clock is moved up');
      // Around the loop seam: the clock has wrapped (trackTime 76.85), the music just restarted.
      check(Rh.seekTarget(76.85, 0.05, loop) === null, 'loop boundary: clock past the seam, music just wrapped, in sync');
      check(Rh.seekTarget(76.75, 0.0, loop) === null, 'loop boundary: music wrapped 50 ms early, in sync');
      check(near(Rh.audioError(1, 76.5, loop), -1.3, 1e-9), 'loop boundary: error is measured the short way round');
      check(Rh.seekTarget(5, null, loop) === null && Rh.seekTarget(5, undefined, loop) === null && Rh.seekTarget(5, NaN, loop) === null,
        'muted / unavailable audio: nothing to align, no error');
      check(near(Rh.seekTarget(200, 50, loop), 200 % loop, 1e-9), 'a long run seeks inside the loop');
      check(Rh.seekTarget(3, 3.05, 0) === null, 'no loop length known: plain comparison');
    }

    // ---- Speed profile: exact time ↔ distance ----
    {
      for (const [s0, s1, len] of [[240, 260, 5000], [355, 410, 7000], [200, 200, 3000], [300, 250, 4000]]) {
        const p = Rh.profile(s0, s1, len);
        for (const d of [0, 10, 700, 2500, len, len + 500]) {
          check(near(p.dist(p.time(d)), d, 1e-6), `profile ${s0}→${s1}: dist(time(${d})) round-trips`);
        }
        // Against brute-force integration of the speed ramp.
        let d = 0, t = 0;
        const dt = 1 / 2000;
        while (t < 15) { d += p.speed(d) * dt; t += dt; }
        check(near(p.dist(15), d, 0.5), `profile ${s0}→${s1}: closed form matches integration (${p.dist(15).toFixed(2)} vs ${d.toFixed(2)})`);
        check(p.time(100) < p.time(200), `profile ${s0}→${s1}: time increases with distance`);
      }
    }

    // ---- Stages: beat-aligned patterns ----
    const STAGES = Pulse.STAGES;
    const moving = STAGES.filter((s) => s.items.some((it) => it.slide));
    check(moving.length >= 3, 'the campaign has several stages with moving gaps');
    const gridOf = (stage) => (stage.grid === undefined ? C.rhythm.grid : stage.grid);

    // Screens from 860 to 1240 px long: every contact moment sits on the stage's beat grid.
    const LENGTHS = [860, 960, 1100, 1240];
    for (const stage of STAGES) {
      const beatSec = Rh.beatSeconds(stage.world.bpm);
      for (const len of LENGTHS) {
        const track = Pulse.Campaign.compile(stage, W, len);
        const prof = Rh.profile(stage.speed.start, stage.speed.end, track.speedLength);
        const plain = Pulse.Campaign.compile(Object.assign({}, stage, { grid: 0, items: stage.items.map((it) => Object.assign({}, it, { beat: 0 })) }), W, len);
        track.items.forEach((it, i) => {
          check(near(it.arrive, prof.time(it.at + track.orbY), 1e-9), `${stage.id}#${i} @${len}: arrival time is consistent`);
          const sub = stage.items[i].beat !== undefined ? stage.items[i].beat : gridOf(stage);
          if (sub) {
            const k = it.hitBeat / sub;
            check(near(k, Math.round(k), 1e-6), `${stage.id}#${i} @${len}: contact lands on the ${sub}-beat grid (${k.toFixed(4)})`);
          }
          check(near(it.arriveBeat, it.arrive / beatSec, 1e-9), `${stage.id}#${i} @${len}: arriveBeat matches arrival`);
          if (i) check(it.at >= track.items[i - 1].at + track.items[i - 1].h, `${stage.id}#${i} @${len}: items keep their order`);
        });
        check(track.energyTotal === plain.energyTotal, `${stage.id}: aligning does not change the gold count`);
        check(track.finishAt >= plain.finishAt - 1e-6, `${stage.id} @${len}: aligned stage is never shorter`);
      }
    }

    // Plays a stage with the game's own rules, steering like a player. Records every moving gap's
    // clearance around the orb while it crosses.
    function simulate(stage, height, dt) {
      height = height || 960;
      dt = dt || 1 / 60;
      const orbY = Math.round(height * C.orb.yRatio);
      const level = new Pulse.Campaign.CampaignLevel(W, height, stage);
      const orb = Pulse.Orb.create();
      const slides = {};
      let frames = 0, energy = 0, hash = 0, crashed = false, completed = false;
      while (frames * dt < 300) {
        const speed = level.speedAt();
        Pulse.Orb.setTarget(orb, Pulse.autosteer(level, orb.x, orbY, speed), W);
        Pulse.Orb.step(orb, Pulse.autopilot(level, orbY, speed), dt, W);
        frames++;
        level.update(dt, speed);
        for (const s of level.segments) {
          if (!s.active) continue;
          if (s.kind === 'gate' && s.slide) {
            const rec = slides[s.arriveBeat] || (slides[s.arriveBeat] = { minClear: Infinity, maxOff: 0, rate: 0, lastL: null, lastR: null, atArrival: null, slide: s.slide, cx0: s.cx0, minHalf: Infinity });
            const off = s.cx - s.cx0;
            rec.maxOff = Math.max(rec.maxOff, Math.abs(off));
            rec.minHalf = Math.min(rec.minHalf, (s.gapR - s.gapL) / 2);
            if (rec.lastL !== null) rec.rate = Math.max(rec.rate, Math.abs(s.gapL - rec.lastL) / dt, Math.abs(s.gapR - rec.lastR) / dt);
            rec.lastL = s.gapL;
            rec.lastR = s.gapR;
            if (rec.atArrival === null && s.y + s.h >= orbY) rec.atArrival = { time: level.time, off, half: (s.gapR - s.gapL) / 2 };
            if (s.y + s.h >= orbY - orb.radius && s.y <= orbY + orb.radius) rec.minClear = Math.min(rec.minClear, orb.x - orb.radius - s.gapL, s.gapR - (orb.x + orb.radius));
            hash = (hash * 31 + Math.round(off * 1000)) % 1000003;
          }
          const e = level.resolve(s, orbY, orb.radius, orb.charge, orb.x);
          if (e === 'crash') { crashed = true; return { crashed, completed, slides, hash, level, frames, energy }; }
          if (e === 'collect' && s.variant !== 'bonus') energy++;
        }
        if (level.finishY() >= orbY) { completed = true; break; }
      }
      return { crashed, completed, slides, hash, level, frames, energy };
    }

    // ---- Moving gaps: fair, bounded and deterministic ----
    let slideCount = 0;
    for (const stage of moving) {
      const bpm = stage.world.bpm;
      for (const len of [860, 960, 1240]) {
        const a = simulate(stage, len);
        const b = simulate(stage, len);
        check(a.completed && !a.crashed, `${stage.id} @${len}: a steering player gets through the moving gaps`);
        check(a.hash === b.hash && a.frames === b.frames, `${stage.id} @${len}: motion is identical on every run`);
        // Same motion at 30 fps and 144 fps (position is a function of run time, not of frames).
        const slow = simulate(stage, len, 1 / 30);
        const fast = simulate(stage, len, 1 / 144);
        check(slow.completed && fast.completed, `${stage.id} @${len}: completes at 30 and 144 fps`);
        for (const key of Object.keys(a.slides)) {
          slideCount++;
          const r = a.slides[key];
          const src = stage.items.find((it) => it.slide && it.slide.amp === r.slide.amp && it.need === r.slide.base);
          check(r.minHalf >= C.orb.minRadius + C.lateral.minWindow - 1e-6, `${stage.id}: gap never closes below the fair minimum (${r.minHalf.toFixed(1)} px)`);
          check(!src || r.minHalf >= src.need - 1e-6, `${stage.id}: half-width never drops below the authored need`);
          check(r.minClear >= -1e-6, `${stage.id}: the orb always clears the walls while crossing (${r.minClear.toFixed(1)} px)`);
          check(r.maxOff <= r.slide.amp + 1e-6, `${stage.id}: swing stays within ±${r.slide.amp} px (${r.maxOff.toFixed(1)})`);
          check(r.rate <= C.motion.maxRate * 1.05 + 1, `${stage.id}: gap edge moves ${r.rate.toFixed(0)} px/s, within the ${C.motion.maxRate} limit`);
          check(r.rate <= C.steer.maxSpeed * 0.2, `${stage.id}: gap edges move much slower than the orb can steer`);
          const want = Rh.motionShape(r.slide, r.atArrival.time * bpm / 60, parseFloat(key));
          check(near(r.atArrival.off, want.off, 1e-6) && near(r.atArrival.half, want.half, 1e-6), `${stage.id}: gap on arrival matches the motion function`);
          if (r.slide.kind === 'breathe') check(r.maxOff < 1e-6, `${stage.id}: a breathing gap stays centred`);
        }
      }
      // Collision geometry always matches what is drawn: the walls are the gap edges.
      const level = new Pulse.Campaign.CampaignLevel(W, 960, stage);
      let tested = 0;
      for (let f = 0; f < 60 * 40 && tested < 50; f++) {
        level.update(1 / 60, level.speedAt());
        for (const s of level.segments) {
          if (!s.active || !s.slide) continue;
          const y = s.y + s.h / 2;
          check(!level.hitsWall(s, s.cx, y, C.orb.minRadius), 'a shrunk orb centred in a moving gap is never hit');
          check(level.hitsWall(s, s.gapL - 1, y, C.orb.minRadius), 'an orb overlapping the left wall is hit');
          check(level.hitsWall(s, s.gapR + 1, y, C.orb.minRadius), 'an orb overlapping the right wall is hit');
          tested++;
        }
      }
      check(tested > 0, `${stage.id}: moving gaps were exercised`);
    }
    check(slideCount >= 9, `moving gaps measured (${slideCount})`);

    // Authoring rules reject unfair or unreadable motion.
    {
      const base = STAGES[2];
      const mod = (item) => Object.assign({}, base, { items: base.items.slice().concat([item]) });
      const bad = (item) => Pulse.Campaign.validate(mod(item), W).length > 0;
      const gap = { type: 'gate', need: 44, t: 0.9, beat: 0.5 };
      check(!bad(Object.assign({}, gap, { slide: { amp: 14, beats: 6 } })), 'a sensible moving gap is accepted');
      check(bad(Object.assign({}, gap, { slide: { amp: 14, beats: 1 } })), 'a swing faster than the minimum period is rejected');
      check(bad(Object.assign({}, gap, { slide: { amp: 150, beats: 4 } })), 'a swing faster than the rate limit is rejected');
      check(bad(Object.assign({}, gap, { need: 20, slide: { amp: 10, beats: 6 } })), 'a gap that closes below the fair minimum is rejected');
      check(bad(Object.assign({}, gap, { need: 230, slide: { amp: 20, beats: 8 } })), 'a swing that leaves the lane is rejected');
      check(bad(Object.assign({}, gap, { slide: { kind: 'wobble', amp: 12, beats: 4 } })), 'an unknown motion kind is rejected');
      check(bad(Object.assign({}, gap, { length: 200, slide: { amp: 14, beats: 4 } })), 'tunnels cannot move');
      check(bad({ type: 'barrier', t: 0.6, slide: { amp: 14, beats: 4 }, beat: 1 }), 'only gaps can move');
    }

    // Level.reset puts moving gaps and the run clock back.
    {
      const stage = moving[0];
      const level = new Pulse.Campaign.CampaignLevel(W, 960, stage);
      for (let i = 0; i < 600; i++) level.update(1 / 60, level.speedAt());
      check(level.time > 9.9 && level.segments.some((s) => s.active), 'run clock advances with the level');
      level.reset();
      check(level.time === 0 && level.travelled === 0 && !level.segments.some((s) => s.active), 'retry resets the run clock and clears moving gaps');
      const again = [];
      for (let i = 0; i < 600; i++) { level.update(1 / 60, level.speedAt()); again.push(level.segments.filter((s) => s.active && s.slide).map((s) => Math.round(s.gapL * 100)).join()); }
      const first = new Pulse.Campaign.CampaignLevel(W, 960, stage);
      let same = true;
      for (let i = 0; i < 600; i++) { first.update(1 / 60, first.speedAt()); if (first.segments.filter((s) => s.active && s.slide).map((s) => Math.round(s.gapL * 100)).join() !== again[i]) same = false; }
      check(same, 'a retried run plays out identically to a fresh one');
    }

    // A level with no tempo (Endless) never moves anything.
    check(!new Pulse.Level(W, 1000).bpm, 'a level without a tempo has no moving gaps');

    // ---- Rotating rings: kept in the engine, switched off in the portrait campaign ----
    check(!STAGES.some((st) => st.items.some((it) => it.ring)), 'the portrait campaign uses no ring gates (the code stays for later)');

    // ---- Fluid orb: springy to look at, truthful about size ----
    {
      const Fx = Rh.OrbFx;
      const R0 = C.orb.radius;
      // Drives the real orb rules and the visual model with a hold/release script at a given frame rate.
      const run = (fps, script, seconds) => {
        const orb = Pulse.Orb.create();
        const st = Fx.create();
        const dt = 1 / fps;
        let minGap = Infinity, maxExtra = 0, below = 0, along = 1, across = 1, t = 0;
        const trace = [];
        for (let i = 0; i < seconds * fps; i++) {
          t += dt;
          Pulse.Orb.step(orb, script(t), dt);
          const v = Fx.step(st, orb.radius, dt, false);
          minGap = Math.min(minGap, v.radius - orb.radius);
          maxExtra = Math.max(maxExtra, v.radius - orb.radius);
          if (v.along < 1 || v.across < 1) below++;
          along = Math.max(along, v.along);
          across = Math.max(across, v.across);
          trace.push([t, orb.radius, v.radius]);
        }
        return { minGap, maxExtra, below, along, across, trace, orb, v: Fx.step(st, orb.radius, 0, false) };
      };
      const taps = (t) => (t % 1.6) < 0.7; // hold 0.7 s, release 0.9 s, repeat
      for (const fps of [20, 30, 60, 90, 144]) {
        const r = run(fps, taps, 12);
        check(r.minGap >= -1e-9, `${fps} fps: the drawn orb is never smaller than the collision circle (${r.minGap.toFixed(3)})`);
        check(r.maxExtra <= Fx.maxExtra + 1e-9, `${fps} fps: it never exceeds it by more than ${Fx.maxExtra} px (${r.maxExtra.toFixed(2)})`);
        check(r.below === 0, `${fps} fps: stretch scales are never below 1`);
        check(r.along <= 1.09 && r.across <= 1.07, `${fps} fps: stretch stays subtle (${r.along.toFixed(3)} / ${r.across.toFixed(3)})`);
      }
      // The same motion at any frame rate (springs step in fixed 4 ms slices).
      const sample = (fps) => {
        const trace = run(fps, taps, 6).trace;
        // How far the drawn orb is past the collision circle at each moment (the physics itself is sampled per frame).
        return [0.9, 1.5, 2.4, 3.1, 4.7, 5.9].map((tt) => { const p = trace.reduce((best, q) => (Math.abs(q[0] - tt) < Math.abs(best[0] - tt) ? q : best)); return p[2] - p[1]; });
      };
      const ref = sample(240);
      for (const fps of [30, 60, 144]) {
        const s = sample(fps);
        const dev = Math.max(...s.map((v, i) => Math.abs(v - ref[i])));
        check(dev < 1.4, `${fps} fps: the drawn extra size matches the 240 fps reference (max ${dev.toFixed(2)} px apart)`);
      }
      // Settles exactly on the collision radius, and eases rather than snaps.
      const rest = run(60, () => false, 3);
      check(near(rest.v.radius, R0, 0.02) && near(rest.v.along, 1, 0.003) && near(rest.v.across, 1, 0.003), 'a resting orb is drawn at exactly the collision radius with no stretch');
      const held = run(60, () => true, 0.2);
      check(held.trace[2][2] < R0 - 0.3, 'a hold shows on screen within 3 frames (50 ms): shrinking starts at once');
      check(held.trace.every(([, rr, vr]) => vr >= rr - 1e-9 && vr - rr <= Fx.maxExtra + 1e-9), 'while shrinking the drawn orb eases down behind the collision circle, never below it');
      // The drawn orb overshoots on release (a pop) but never goes under.
      const pop = run(144, (t) => t < 0.5, 1.5);
      let popped = 0;
      for (const [, rr, vr] of pop.trace) popped = Math.max(popped, vr - rr);
      check(popped > 0.3 && popped <= Fx.maxExtra, `releasing pops the orb slightly past full size (${popped.toFixed(2)} px) and never below`);
      // Collision is authoritative: the model has no way to change it.
      const orbBefore = Pulse.Orb.create();
      Pulse.Orb.step(orbBefore, true, 0.1);
      const st = Fx.create();
      Fx.step(st, orbBefore.radius, 0.1, true);
      Fx.kick(st, 5);
      check(near(orbBefore.radius, R0 - C.orb.shrinkRate * 0.1, 1e-9), 'cosmetic effects never touch the orb rules');
      // Reward pop settles.
      let pst = Fx.create(), maxPop = 0, pv;
      Fx.kick(pst, 4);
      for (let i = 0; i < 240; i++) { pv = Fx.step(pst, R0, 1 / 120, false); maxPop = Math.max(maxPop, pv.pop); }
      check(maxPop > 0.02 && maxPop <= 0.35 && pv.pop < 0.005, `a reward pulse rises to ${maxPop.toFixed(3)} and settles`);
      // Springs are frame-rate independent on their own.
      const sA = Rh.createSpring(0), sB = Rh.createSpring(0);
      for (let i = 0; i < 60; i++) Rh.springStep(sA, 10, 1 / 60, 6, 0.5);
      for (let i = 0; i < 144; i++) Rh.springStep(sB, 10, 1 / 144, 6, 0.5);
      check(near(sA.x, sB.x, 0.25), `a spring lands in the same place at 60 and 144 fps (${sA.x.toFixed(2)} vs ${sB.x.toFixed(2)})`);
    }

    // ---- Sound timing: input is never delayed ----
    {
      check(C.groove.inputDelay === 0 && C.groove.eventDelay <= 0.05, `input sounds are immediate and reward sounds wait at most ${C.groove.eventDelay * 1000} ms`);
      check(C.rhythm.syncTolerance >= 0.12 && C.groove.maxSeeks <= 6, 'the music is only re-aligned for real drift, and rarely');
    }

    // ---- Groove: sounds land on the music, gameplay never waits ----
    {
      const G = Rh.Groove;
      const c = Rh.createClock({ bpm: 125 }); // 16th note = 0.12 s
      const at = (t) => { Rh.reset(c, 125); c.t = t; return c; };
      check(near(G.delay(at(0.1), true, 0.07), 0.02, 1e-9), 'a sound 20 ms before a 16th note waits for it');
      check(G.delay(at(0.13), true, 0.07) === 0, 'too far from the next 16th (110 ms): plays at once');
      check(G.delay(at(0.12), true, 0.07) === 0 && G.delay(at(0), true, 0.07) === 0, 'a sound already on the grid is not delayed');
      check(G.delay(at(0.1), false, 0.07) === 0, 'music not aligned (muted / loading): plays at once');
      let worst = 0, early = false;
      for (let t = 0; t < 8; t += 0.0137) {
        const d = G.delay(at(t), true, 0.07);
        worst = Math.max(worst, d);
        if (d < 0) early = true;
        // After the wait the sound is on a 16th-note line.
        if (d > 0) { const k = (t + d) / 0.12; if (!near(k, Math.round(k), 1e-6)) early = true; }
      }
      check(!early && worst <= 0.07 + 1e-9, `sounds only ever wait (max ${(worst * 1000).toFixed(0)} ms) and land on the grid`);
      for (const bpm of [112, 125, 133, 140]) {
        const k = Rh.createClock({ bpm }); k.t = 0.05;
        const d = G.delay(k, true, 1, 0.25);
        check(near(((0.05 + d) / (60 / bpm * 0.25)) % 1, 0, 1e-6) || near(((0.05 + d) / (60 / bpm * 0.25)) % 1, 1, 1e-6), `${bpm} BPM: grid follows the tempo`);
      }
      check(G.nearBeat(at(0.05), 0.075) && G.nearBeat(at(0.48 - 0.05), 0.075) && !G.nearBeat(at(0.24), 0.075), 'nearBeat is symmetric around the beat');
      // Pickup melody: climbs the world's scale then comes back, always in range.
      for (const w of [1, 2, 3]) {
        const notes = [];
        for (let i = 0; i < 24; i++) notes.push(G.noteRate(w, i));
        check(notes.every((r) => r >= 0.7 && r <= 2.2), `world ${w}: every melody note is in a clean pitch range`);
        check(notes[1] > notes[0] && notes[5] > notes[4], `world ${w}: the melody climbs at first`);
        check(near(notes[0], notes[10], 1e-9) && near(notes[3], notes[7], 1e-9), `world ${w}: the melody turns around and repeats`);
        let leap = 0;
        for (let i = 1; i < notes.length; i++) leap = Math.max(leap, Math.abs(12 * Math.log2(notes[i] / notes[i - 1])));
        check(leap <= 5.01, `world ${w}: no leap larger than a fourth (${leap.toFixed(1)} semitones)`);
      }
      check(G.noteRate(1, -5) === G.noteRate(1, 0), 'a negative step is treated as the first note');
    }

    // ---- Orb effects: never smaller than the collision circle ----
    {
      let ok = true, maxAlong = 0, maxGlow = 0;
      for (let rate = -400; rate <= 400; rate += 10) {
        const st = Rh.OrbFx.stretchTarget(rate);
        check(st >= 0 && st <= Rh.OrbFx.maxStretch + 1e-12, `stretch target stays in range (${st.toFixed(3)})`);
        for (let phase = 0; phase < 1; phase += 0.05) {
          const s = Rh.OrbFx.scales(phase, st);
          if (s.along < 1 || s.across < 1 || s.glow < 1) ok = false;
          maxAlong = Math.max(maxAlong, s.along);
          maxGlow = Math.max(maxGlow, s.glow);
        }
      }
      check(ok, 'orb effect scales are never below 1: the drawn orb always covers the collision circle');
      check(maxAlong <= 1.06 && maxGlow <= 1.09, `orb effects stay subtle (stretch ${maxAlong.toFixed(3)}, glow ${maxGlow.toFixed(3)})`);
      let s = 0;
      for (let i = 0; i < 600; i++) s = Rh.OrbFx.stretchStep(s, Rh.OrbFx.maxStretch, 1 / 60);
      check(near(s, Rh.OrbFx.maxStretch, 1e-6), 'stretch settles on its target');
      const slowStep = Rh.OrbFx.stretchStep(0, 0.05, 1 / 30);
      let fastStep = 0;
      fastStep = Rh.OrbFx.stretchStep(Rh.OrbFx.stretchStep(0, 0.05, 1 / 60), 0.05, 1 / 60);
      check(near(slowStep, fastStep, 1e-9), 'stretch smoothing is frame-rate independent');
      // The orb's real size is untouched by effects: rules read Pulse.Orb only.
      const orb = Pulse.Orb.create();
      Pulse.Orb.step(orb, true, 0.1);
      check(near(orb.radius, R - C.orb.shrinkRate * 0.1, 1e-9), 'orb size follows the shrink rate exactly');
      Pulse.Orb.step(orb, true, 5);
      check(orb.radius === C.orb.minRadius, 'orb stops shrinking at its minimum radius');
    }

    // ---- Save compatibility ----
    {
      const ids = ['s1-first-pulse', 's2-find-the-rhythm', 's3-controlled-overload'];
      check(ids.every((id, i) => STAGES[i].id === id), 'the original three stage ids are unchanged');
      check(STAGES.length >= 12 && ['s4-split-decision', 's12-the-final-pulse'].every((id, i) => STAGES[i === 0 ? 3 : 11].id === id), 'the shipped 12 stages are still in place');
      for (const s of STAGES) {
        const t = Pulse.Campaign.compile(s, W);
        check(t.energyTotal === s.items.filter((it) => it.type === 'energy').length, `${s.id}: gold count unchanged by the rhythm layer`);
      }
      const d = Pulse.Save.defaults();
      check(!('rhythm' in d) && !('clock' in d), 'the rhythm layer adds nothing to the save file');
    }

    document.title = (failures ? 'FAIL ' + failures + ' of ' : 'PASS ') + checks + ' checks';
    document.getElementById('out').textContent = document.title + '\n' + lines.join('\n');
  </script>
</body>
</html>
